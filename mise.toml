redactions = ["DB_PASSWORD"]

[tools]
uv = "0.12.9"
atlas = "1.3.0"

yq = "4.53.6"
hurl = "8.0.1"
gum = "2.0.0"

# Linting and Formatting
kubeconform = "0.8.0"
kube-linter = "0.8.3"

shellcheck = "0.11.0"
shfmt = "3.14.0"
dprint = "0.57.1"

# Kubernetes-related
helm = "4.2.4"

kubectl = "1.37.0"
kapp = "0.65.4"
k3d = "5.9.0"
k9s = "0.51.0"

# Encryption
sops = "3.13.3"
age = "1.3.2"


[settings]
experimental = true
pin = true


[env]
_.file = [{ path = "{{ config_root }}/docker/.env" }]
DATABASE_URL = "postgres://{{env.DB_USERNAME}}:{{env.DB_PASSWORD}}@localhost:5432/{{env.DB_DATABASE_NAME}}?search_path=public&sslmode=disable"
DEV_DATABASE_URL = "postgres://{{env.DB_USERNAME}}:{{env.DB_PASSWORD}}@localhost:5432/postgres?search_path=public&sslmode=disable"

# Docker
[tasks."docker:preview"]
depends = ["server:check-env"]
description = "Runs the preview docker compose stack, i.e., runs the server with databases and other services for previewing the application"
dir = "{{ config_root }}"
run = """
COMPOSE_FILE="docker/docker-compose.yml"
ENV_FILE="docker/.env"

docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build \
    && docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull \
    && docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d
"""

[tasks."docker:web"]
alias = ["docker:ucmacm", "server:docker:web", "server:docker:ucmacm"]
depends = ["server:check-env"]
description = "Runs the full website stack, including all operations to set it up for a preview"
dir = "{{ config_root }}"
run = """
COMPOSE_FILE="docker/docker-compose.web.yml"
ENV_FILE="docker/.env"

docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build \
    && docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" pull \
    && docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d
"""

[tasks."server:start"]
alias = ["server:up", "server:dev"]
description = "Start backend development server. Save file(s) to see changes through reloading"
env._.path = ".venv/bin"
dir = "{{ config_root }}"
run = "granian main:app --interface=asgi --loop=uvloop --working-dir=src --access-log --log-config=logging.conf.json --reload-paths=src --reload"
run_windows = "granian main:app --interface=asgi --loop=winloop --working-dir=src --access-log --log-config=logging.conf.json --reload-paths=src --reload"

[tasks."server:lint"]
description = "Lints the codebase by type checking and general linting"
env._.path = ".venv/bin"
run = ["ty check src --error-on-warning", "ruff check src --fix --exit-non-zero-on-fix"]

[tasks."server:format"]
description = "Formats the codebase"
env._.path = ".venv/bin"
run = "ruff format src"

[tasks."server:check"]
description = "Lint and format backend codebase. This is necessary to handle import sorting and formatting. TD;LR: Run this task once you are done with development at the end of the PR"
run = [{ task = "server:lint" }, { task = "server:format" }]

[tasks."tests:lint"]
description = "Lints the testing codebase by type checking and general linting"
env._.path = ".venv/bin"
run = ["ty check tests/*.py --error-on-warning", "ruff check tests --fix --exit-non-zero-on-fix"]

[tasks."tests:format"]
description = "Formats the testing codebase"
env._.path = ".venv/bin"
run = "ruff format tests"

[tasks."tests:check"]
description = "Lint and format testing codebase. This is necessary to handle import sorting and formatting. TD;LR: Run this task once you are done with development at the end of the PR"
run = [{ task = "tests:lint" }, { task = "tests:format" }]


[tasks."scripts:lint"]
description = "Lints all bash scripts via Shellcheck"
dir = "{{ config_root }}"
run = """
#!/usr/bin/env bash

shopt -s globstar nullglob dotglob
shellcheck {{ config_root }}/**/*.sh
"""

[tasks."scripts:format"]
description = "Formats all bash scripts via shfmt"
dir = "{{ config_root }}"
run = "shfmt -l -w -bn -ci {{ config_root }}"

[tasks."scripts:check"]
description = "Lints and formats all bash scripts"
run = [{ task = "scripts:lint" }, { task = "scripts:format" }]

[tasks."server:check-env"]
hide = true
run = "test -f {{ config_root }}/docker/.env"
run_windows = "Test-Path {{ config_root }}/docker/.env"

[tasks."server:schema:plan"]
depends = ["server:check-env"]
description = "Plans schema diffs"
run = "atlas schema plan --to file://src/schema.sql --env dev --var url=$DATABASE_URL --var dev_url=$DEV_DATABASE_URL"

[tasks."server:schema:apply"]
depends = ["server:check-env"]
description = "Applies schema diffs to database"
run = "atlas schema apply --auto-approve --env dev --var url=$DATABASE_URL --var dev_url=$DEV_DATABASE_URL"

[tasks."server:docker:up"]
depends = ["server:check-env"]
description = "Brings up the development databases through Docker Compose"
usage = '''
arg "[environment]" help="Target docker compose" default="dev" {
  choices "dev" "seed" "test"
}
'''
run = """
COMPOSE_FILE="docker/docker-compose.${usage_environment?}.yml"
ENV_FILE="docker/.env"

docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" build \
    && docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" up -d
"""

[tasks."server:docker:stop"]
depends = ["server:check-env"]
description = "Stops the development databases through Docker Compose"
usage = '''
arg "[environment]" help="Target docker compose" default="dev" {
  choices "dev" "seed" "test" "web"
}
'''
run = """
COMPOSE_FILE="docker/docker-compose.${usage_environment?}.yml"
ENV_FILE="docker/.env"

docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" stop
"""

[tasks."server:docker:down"]
depends = ["server:check-env"]
description = "Takes down the development databases through Docker Compose"
usage = '''
arg "[environment]" help="Target docker compose" default="dev" {
  choices "dev" "seed" "test" "web"
}
'''
run = """
COMPOSE_FILE="docker/docker-compose.${usage_environment?}.yml"
ENV_FILE="docker/.env"

docker compose -f "$COMPOSE_FILE" --env-file "$ENV_FILE" down -v=True
"""

[tasks."yaml:lint"]
alias = ["k8s:lint"]
description = "Lints through YAML files via yamllint"
env._.path = ".venv/bin"
dir = "{{ config_root }}"
run = "yamllint --strict ."

[tasks."yaml:format"]
alias = ["k8s:fmt"]
description = "Formats YAML files via dprint"
run = "dprint fmt {{ config_root }}"

[tasks."yaml:format:check"]
alias = ["k8s:fmt:check"]
description = "Checks for formatting via dprint"
run = "dprint check {{ config_root }}"

[tasks."yaml:check"]
description = "Lints and formats YAML files"
run = [ {task = "yaml:lint" }, { task = "yaml:format" }]

[tasks."k8s:up"]
description = "Creates the local k3d cluster from deploy/kubernetes/k3d.yml and waits for its node to report Ready"
dir = "{{ config_root }}"
run = [
  "k3d cluster create --config deploy/kubernetes/k3d.yml",
  "kubectl wait --for=condition=Ready nodes --all --timeout=300s",
  "kubectl create namespace kanae",
  "kubectl get nodes",
]

[tasks."k8s:down"]
description = "Deletes the local k3d cluster"
dir = "{{ config_root }}"
run = "k3d cluster delete --config deploy/kubernetes/k3d.yml"

[tasks."k8s:reset"]
description = "Destroys the local k3d cluster and creates it again from scratch"
run = [{ task = "k8s:down" }, { task = "k8s:up" }]

[tasks."helm:files"]
hide = true
description = "Checks that every entry under deploy/kubernetes/src/files/ is a relative symlink to the right source, and that CI watches that source"
dir = "{{ config_root }}"
run = "deploy/kubernetes/scripts/check-symlinks.sh"
run_windows = "pwsh -NoProfile -File deploy/kubernetes/scripts/powershell/check-symlinks.ps1"

[tasks."k8s:render"]
depends = ["helm:files"]
description = "Regenerates deploy/kubernetes/dist/ from the production values, one file per resource"
dir = "{{ config_root }}"
run = '''
rm -f deploy/kubernetes/dist/*.yml
helm template kanae deploy/kubernetes/src --namespace kanae | yq --no-doc 'select(.kind != null and .kind != "Secret")' -s '"deploy/kubernetes/dist/\(.kind | downcase)-\(.metadata.name).yml"'
'''

[tasks."k8s:render:local"]
depends = ["helm:files"]
description = "Renders the local values into .k8s-local/, a build artifact that stays out of the repository"
dir = "{{ config_root }}"
run = '''
rm -f .k8s-local/*.yml
helm template kanae deploy/kubernetes/src --namespace kanae --values deploy/kubernetes/values.local.yml | yq --no-doc 'select(.kind != null and .kind != "Secret")' -s '".k8s-local/\(.kind | downcase)-\(.metadata.name).yml"'
'''

[tasks."k8s:render:check"]
description = "Fails if deploy/kubernetes/dist/ is not what the chart renders today. Run 'mise run k8s:render' and commit the result"
dir = "{{ config_root }}"
depends = ["k8s:render"]
run = [
  "git add --intent-to-add --ignore-removal -- deploy/kubernetes/dist",
  "git diff HEAD --exit-code -- 'deploy/kubernetes/dist/*.yml'",
]

[tasks."k8s:apply"]
depends = ["helm:files"]
description = "Applies deploy/kubernetes/dist/ and the Secrets from secrets.sops.yml through kapp, which diffs and asks before it changes anything"
dir = "{{ config_root }}"
run = "deploy/kubernetes/scripts/apply.sh"
run_windows = "pwsh -NoProfile -File deploy/kubernetes/scripts/powershell/apply.ps1"

# Hands the terminal straight to the script. Without it mise sits between the
# two, and the passphrase age asks for is echoed in the clear.
raw = true

[tasks."k8s:apply:local"]
description = "Applies .k8s-local/ under its own app name, so a local render and production cannot be confused"
dir = "{{ config_root }}"
usage = '''
flag "--wait <wait>" help="Wait for every resource to become healthy" default="true"
'''
run = "kapp deploy -a kanae-local -n kanae -c -f .k8s-local --wait=${usage_wait?}"

[tasks."k8s:validate"]
description = "Validates the manifests against the Kubernetes schemas via kubeconform"
dir = "{{ config_root }}"
run = '''kubeconform -strict -summary -ignore-filename-pattern 'kubernetes/src/' -ignore-filename-pattern 'k3d\.yml$' -ignore-filename-pattern 'values.*\.(ya?ml|json)$' -ignore-filename-pattern 'secrets.*\.ya?ml$' deploy/kubernetes'''

[tasks."k8s:policy"]
description = "Checks the chart sources for what only a human would notice, then the rendered manifests against .kube-linter.yml"
dir = "{{ config_root }}"
run = "deploy/kubernetes/scripts/check-policy.sh"
run_windows = "pwsh -NoProfile -File deploy/kubernetes/scripts/powershell/check-policy.ps1"

[tasks."k8s:schema"]
depends = ["helm:files"]
description = "Checks values.yaml against the chart's JSON schema, so a misspelled key fails instead of rendering the default"
dir = "{{ config_root }}"
run = [
  "helm lint deploy/kubernetes/src",
  "helm lint deploy/kubernetes/src --values deploy/kubernetes/values.local.yml",
]

[tasks."garage:generate:keys"]
description = "Generate Garage RPC/admin/metrics secrets into docker/.env. Appends — re-run to rotate."
dir = "{{ config_root }}"
run = """
  {
    echo "GARAGE_RPC_SECRET=$(openssl rand -hex 32)"
    echo "GARAGE_ADMIN_TOKEN=$(openssl rand -base64 32)"
    echo "GARAGE_METRICS_TOKEN=$(openssl rand -base64 32)"
  } >> docker/.env
"""
run_windows = """
  if (-not (Get-Command openssl -ErrorAction SilentlyContinue)) {
      throw "openssl is not available on PATH. Install OpenSSL for Windows (e.g. via winget, scoop, or chocolatey) and retry."
  }
  @"
  GARAGE_RPC_SECRET=$(openssl rand -hex 32)
  GARAGE_ADMIN_TOKEN=$(openssl rand -base64 32)
  GARAGE_METRICS_TOKEN=$(openssl rand -base64 32)
  "@ | Add-Content -Path docker\\.env
"""

[tasks."garage:status"]
alias = ["garage:s"]
description = "Show garage S3 cluster status"
dir = "{{ config_root }}"
run = "docker compose -f docker/docker-compose.dev.yml exec garage /garage status"

[tasks."garage:setup"]
description = "Initialize Garage cluster: apply layout, import key, create bucket, and configure CORS. Run this after a fresh Garage start or data loss."
dir = "{{ config_root }}"
run = """
  set -e
  CONFIG="{{ config_root }}/config.yml"
  GARAGE_KEY_ID=$(yq '.storage.key_id' "$CONFIG")
  GARAGE_SECRET_KEY=$(yq '.storage.secret_key' "$CONFIG")
  GARAGE_BUCKET=$(yq '.storage.bucket' "$CONFIG")
  GARAGE_PUBLIC_BUCKET=$(yq '.storage.public.bucket' "$CONFIG")
  GARAGE_URL=$(yq '.storage.url' "$CONFIG")
  export AWS_ACCESS_KEY_ID="$GARAGE_KEY_ID"
  export AWS_SECRET_ACCESS_KEY="$GARAGE_SECRET_KEY"

  NODE_ID=$(docker compose -f docker/docker-compose.dev.yml exec garage /garage status 2>/dev/null | awk '/HEALTHY NODES/{f=2; next} f==2{f=1; next} f==1 && NF{print $1; exit}')
  echo "Assigning layout to node: $NODE_ID"
  docker compose -f docker/docker-compose.dev.yml exec garage /garage layout assign -z dc1 -c 5G "$NODE_ID"
  docker compose -f docker/docker-compose.dev.yml exec garage /garage layout apply --version 1
  echo "Importing access key..."
  docker compose -f docker/docker-compose.dev.yml exec garage /garage key import --yes -n kanae "$GARAGE_KEY_ID" "$GARAGE_SECRET_KEY"
  echo "Creating bucket and granting access..."
  docker compose -f docker/docker-compose.dev.yml exec garage /garage bucket create "$GARAGE_BUCKET"
  docker compose -f docker/docker-compose.dev.yml exec garage /garage bucket allow --read --write --owner "$GARAGE_BUCKET" --key "$GARAGE_KEY_ID"
  echo "Setting bucket CORS policy..."
  uvx --from=awscli aws s3api put-bucket-cors \
    --endpoint-url "$GARAGE_URL" \
    --bucket "$GARAGE_BUCKET" \
    --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","PUT","HEAD"],"AllowedHeaders":["*"],"MaxAgeSeconds":3600}]}' \
    --region garage
  echo "Setting bucket lifecycle policy (abort abandoned multipart uploads after 1 day)..."
  uvx --from=awscli aws s3api put-bucket-lifecycle-configuration \
    --endpoint-url "$GARAGE_URL" \
    --bucket "$GARAGE_BUCKET" \
    --lifecycle-configuration '{"Rules":[{"ID":"abort-stale-multipart","Status":"Enabled","Filter":{"Prefix":"media/"},"AbortIncompleteMultipartUpload":{"DaysAfterInitiation":1}}]}' \
    --region garage
  echo "Creating public bucket for thumbnails..."
  docker compose -f docker/docker-compose.dev.yml exec garage /garage bucket create "$GARAGE_PUBLIC_BUCKET"
  docker compose -f docker/docker-compose.dev.yml exec garage /garage bucket allow --read --write --owner "$GARAGE_PUBLIC_BUCKET" --key "$GARAGE_KEY_ID"
  docker compose -f docker/docker-compose.dev.yml exec garage /garage bucket website --allow "$GARAGE_PUBLIC_BUCKET"
  echo "Setting public bucket CORS policy..."
  uvx --from=awscli aws s3api put-bucket-cors \
    --endpoint-url "$GARAGE_URL" \
    --bucket "$GARAGE_PUBLIC_BUCKET" \
    --cors-configuration '{"CORSRules":[{"AllowedOrigins":["*"],"AllowedMethods":["GET","HEAD"],"AllowedHeaders":["*"],"MaxAgeSeconds":86400}]}' \
    --region garage
  echo "Garage setup complete."
"""
