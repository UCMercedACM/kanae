name: Test

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  Test:
    name: Test (${{ matrix.version }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        version: ["3.12", "3.13", "3.14"]

    env:
      TESTCONTAINER_DOCKER_NETWORK: kanae-testcontainers
      UV_NO_DEV: true
      UV_NO_DEFAULT_GROUPS: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.version }}
        id: setup-python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --group test

      - name: Set up server configuration
        run: |
          cp config.dist.yml src/config.yml

      - name: Create Docker network for running Testcontainers
        run: sudo docker network create ${{ env.TESTCONTAINER_DOCKER_NETWORK }}

      - name: Run Tests
        run: |
          uv run --frozen pytest

  Integration:
    name: Integration
    runs-on: ubuntu-24.04

    env:
      HURL_VERSION: 8.0.1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Install Hurl
        run: |
          HURL_ASSET="hurl_${HURL_VERSION}_amd64.deb"
          HURL_RELEASE="https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}"

          curl --proto "=https" -fsSL "${HURL_RELEASE}/${HURL_ASSET}" -o "/tmp/${HURL_ASSET}"
          curl --proto "=https" -fsSL "${HURL_RELEASE}/${HURL_ASSET}.sha256" \
            | awk -v asset="/tmp/${HURL_ASSET}" '{ print $1 "  " asset }' \
            | sha256sum --check --strict -

          sudo apt-get install -y "/tmp/${HURL_ASSET}"

      - name: Prepare integration stack
        run: |
          bash ./tests/integration/init.sh

      - name: Run integration tests
        run: |
          hurl --test --variables-file tests/integration/vars.env --secrets-file tests/integration/secrets.env tests/integration/scenarios/*.hurl

      - name: Clean up integration stack
        run: |
          docker compose -f docker/docker-compose.test.yml --env-file docker/.env down -v=True --remove-orphans
