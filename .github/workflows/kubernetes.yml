name: Kubernetes

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  Changes:
    name: Determine Changes
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    outputs:
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      chart: ${{ steps.filter.outputs.chart }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            kubernetes:
              - '.github/workflows/kubernetes.yml'
              - '.kube-linter.yml'
              - 'deploy/kubernetes/**'
              - 'docker/ory/**'
              - 'scripts/seed/**'
              - 'src/schema.sql'
              - 'config.dist.yml'

            chart:
              - 'deploy/kubernetes/src/**'

  Check:
    name: Check
    runs-on: ubuntu-24.04

    needs: Changes
    if: ${{ needs.Changes.outputs.kubernetes == 'true' }}

    permissions:
      contents: read

    env:
      HELM_VERSION: 4.2.4
      KUBECONFORM_VERSION: 0.8.0
      KUBE_LINTER_VERSION: 0.8.3

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install tools
        run: |
          OS=$(uname | tr '[:upper:]' '[:lower:]')

          ARCH=$(uname -m)
          case $ARCH in
            aarch64) ARCH="arm64";;
            x86_64) ARCH="amd64";;
          esac

          case "$OS-$ARCH" in
            darwin-amd64 | darwin-arm64 | linux-amd64 | linux-arm64) ;;
            *) echo "no prebuilt kubeconform or kube-linter binary for $OS-$ARCH" >&2; exit 1 ;;
          esac

          if [ "$ARCH" = amd64 ]; then
            KUBE_LINTER_ARCH=""
          else
            KUBE_LINTER_ARCH="_$ARCH"
          fi

          curl --proto "=https" -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-${OS}-${ARCH}.tar.gz" \
            | tar -xz -C /tmp kubeconform
          curl --proto "=https" -fsSL "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-${OS}${KUBE_LINTER_ARCH}" \
            -o /tmp/kube-linter

          sudo install -m 0755 /tmp/kubeconform /tmp/kube-linter /usr/local/bin/

      - name: Check production values against schema
        run: helm lint deploy/kubernetes/src

      - name: Check local values against schema
        run: helm lint deploy/kubernetes/src --values deploy/kubernetes/values.local.yml

      - name: Render production manifests
        run: |
          rm -f deploy/kubernetes/dist/*.yml
          helm template kanae deploy/kubernetes/src --namespace kanae \
            | yq --no-doc 'select(.kind != null and .kind != "Secret")' \
              -s '"deploy/kubernetes/dist/\(.kind | downcase)-\(.metadata.name).yml"'

      - name: Render local manifests
        run: |
          mkdir -p .k8s-local
          helm template kanae deploy/kubernetes/src --namespace kanae \
            --values deploy/kubernetes/values.local.yml \
            | yq --no-doc 'select(.kind != null and .kind != "Secret")' \
              -s '".k8s-local/\(.kind | downcase)-\(.metadata.name).yml"'

      - name: Validate production manifests
        run: |
          kubeconform -strict -summary \
            -ignore-filename-pattern 'kubernetes/src/' \
            -ignore-filename-pattern 'k3d\.yml$' \
            -ignore-filename-pattern 'values.*\.(ya?ml|json)$' \
            deploy/kubernetes

      - name: Validate local manifests
        run: kubeconform -strict -summary .k8s-local

      - name: Check manifests against policy
        run: kube-linter lint --config .kube-linter.yml deploy/kubernetes/dist .k8s-local

      - name: Check for manifest drift
        run: |
          git add --intent-to-add --ignore-removal -- deploy/kubernetes/dist
          git diff HEAD --exit-code -- 'deploy/kubernetes/dist/*.yml'

  Render:
    name: Render
    runs-on: ubuntu-24.04

    needs: Changes

    # 29139614 is the renovate[bot] account
    if: >-
      ${{ needs.Changes.outputs.chart == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.user.id == 29139614
      && github.event.pull_request.head.repo.full_name == github.repository }}

    permissions:
      contents: read

    env:
      HELM_VERSION: 4.2.4

    steps:
      - name: Generate automation token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kanae
          permission-contents: write

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Render changes
        run: |
          rm -f deploy/kubernetes/dist/*.yml
          helm template kanae deploy/kubernetes/src --namespace kanae \
            | yq --no-doc 'select(.kind != null and .kind != "Secret")' \
              -s '"deploy/kubernetes/dist/\(.kind | downcase)-\(.metadata.name).yml"'

      - name: Look up the bot's user ID
        id: bot_user
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit the render
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Render Kubernetes changes
          file_pattern: deploy/kubernetes/dist
          commit_user_name: ${{ steps.app_token.outputs.app-slug }}[bot]
          commit_user_email: ${{ steps.bot_user.outputs.id }}+${{ steps.app_token.outputs.app-slug }}[bot]@users.noreply.github.com
