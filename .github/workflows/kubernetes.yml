name: Kubernetes

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

  schedule:
    - cron: "0 6 * * *"

jobs:
  Changes:
    name: Determine Changes
    runs-on: ubuntu-24.04

    permissions:
      contents: read
      pull-requests: read

    outputs:
      kubernetes: ${{ steps.filter.outputs.kubernetes }}
      chart: ${{ steps.filter.outputs.chart }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Determine changed files
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4
        id: filter
        with:
          filters: |
            kubernetes:
              - '.github/workflows/kubernetes.yml'
              - '.kube-linter.yml'
              - '.kubescape/**'
              - 'deploy/kubernetes/**'
              - 'docker/ory/**'
              - 'docker/postgres/**'
              - 'docker/valkey/**'
              - 'scripts/seed/**'
              - 'src/schema.sql'
              - 'config.dist.yml'
              - 'atlas.hcl'

            chart:
              - 'deploy/kubernetes/src/**'

  Check:
    name: Check
    runs-on: ubuntu-24.04

    needs: Changes
    if: ${{ needs.Changes.outputs.kubernetes == 'true' }}

    permissions:
      contents: read

    env:
      HELM_VERSION: 4.3.0
      KUBECONFORM_VERSION: 0.8.0
      KUBE_LINTER_VERSION: 0.8.3
      KUBESCAPE_VERSION: 4.0.14

      CRD_CATALOG: https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install tools
        run: |
          OS=$(uname | tr '[:upper:]' '[:lower:]')

          ARCH=$(uname -m)
          case $ARCH in
            aarch64) ARCH="arm64";;
            x86_64) ARCH="amd64";;
          esac

          case "$OS-$ARCH" in
            darwin-amd64 | darwin-arm64 | linux-amd64 | linux-arm64) ;;
            *) echo "no prebuilt kubeconform, kube-linter or kubescape binary for $OS-$ARCH" >&2; exit 1 ;;
          esac

          if [ "$ARCH" = amd64 ]; then
            KUBE_LINTER_ARCH=""
          else
            KUBE_LINTER_ARCH="_$ARCH"
          fi

          KUBESCAPE_ASSET="kubescape_${KUBESCAPE_VERSION}_${OS}_${ARCH}"
          KUBESCAPE_RELEASE="https://github.com/kubescape/kubescape/releases/download/v${KUBESCAPE_VERSION}"

          curl --proto "=https" -fsSL "https://github.com/yannh/kubeconform/releases/download/v${KUBECONFORM_VERSION}/kubeconform-${OS}-${ARCH}.tar.gz" \
            | tar -xz -C /tmp kubeconform
          curl --proto "=https" -fsSL "https://github.com/stackrox/kube-linter/releases/download/v${KUBE_LINTER_VERSION}/kube-linter-${OS}${KUBE_LINTER_ARCH}" \
            -o /tmp/kube-linter

          curl --proto "=https" -fsSL "${KUBESCAPE_RELEASE}/${KUBESCAPE_ASSET}" -o /tmp/kubescape
          curl --proto "=https" -fsSL "${KUBESCAPE_RELEASE}/checksums.sha256" \
            | awk -v asset="$KUBESCAPE_ASSET" '$2 == asset { print $1 "  /tmp/kubescape" }' \
            | sha256sum --check --strict -

          sudo install -m 0755 /tmp/kubeconform /tmp/kube-linter /tmp/kubescape /usr/local/bin/

      - name: Check symlinks
        run: deploy/kubernetes/scripts/check-symlinks.sh

      - name: Check production values against schema
        run: helm lint deploy/kubernetes/src

      - name: Check local values against schema
        run: helm lint deploy/kubernetes/src --values deploy/kubernetes/values.local.yml

      - name: Render production manifests
        run: |
          rm -f deploy/kubernetes/dist/*.yml
          helm template kanae deploy/kubernetes/src --namespace kanae \
            | yq --no-doc 'select(.kind != null and .kind != "Secret")' \
              -s '"deploy/kubernetes/dist/\(.kind | downcase)-\(.metadata.name).yml"'

      - name: Render local manifests
        run: |
          mkdir -p .k8s-local
          helm template kanae deploy/kubernetes/src --namespace kanae \
            --values deploy/kubernetes/values.local.yml \
            | yq --no-doc 'select(.kind != null and .kind != "Secret")' \
              -s '".k8s-local/\(.kind | downcase)-\(.metadata.name).yml"'

      - name: Validate production manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "$CRD_CATALOG" \
            -ignore-filename-pattern 'kubernetes/src/' \
            -ignore-filename-pattern 'k3d\.yml$' \
            -ignore-filename-pattern 'helmfile\.ya?ml$' \
            -ignore-filename-pattern 'values.*\.(ya?ml|json)$' \
            -ignore-filename-pattern 'secrets.*\.ya?ml$' \
            deploy/kubernetes

      - name: Validate local manifests
        run: |
          kubeconform -strict -summary \
            -schema-location default \
            -schema-location "$CRD_CATALOG" \
            .k8s-local

      - name: Check chart sources and manifests against policy
        run: deploy/kubernetes/scripts/check-policy.sh

      - name: Scan manifests via Kubescape
        run: |
          kubescape scan framework all deploy/kubernetes/dist .k8s-local \
            --exceptions .kubescape/exceptions.json \
            --controls-config .kubescape/controls.json \
            --severity-threshold low \
            --fail-on-degraded-config

      - name: Check for manifest drift
        run: |
          git add --intent-to-add --ignore-removal -- deploy/kubernetes/dist
          git diff HEAD --exit-code -- 'deploy/kubernetes/dist/*.yml'

  Test:
    name: Test
    runs-on: ubuntu-24.04

    needs: Changes
    if: ${{ needs.Changes.outputs.kubernetes == 'true' || github.event_name == 'schedule' }}

    permissions:
      contents: read

    env:
      HELM_VERSION: 4.3.0
      HELMFILE_VERSION: 1.8.0
      K3D_VERSION: 5.9.0
      KAPP_VERSION: 0.65.4
      HURL_VERSION: 8.0.1
      BATS_COMMIT: eb7f42f8d608ac693d7a4b67474f6714ea68cfc5 # v1.14.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Install uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          version: "latest"
          enable-cache: true

      - name: Install k3d
        uses: nolar/setup-k3d-k3s@62c9d1bd2bc843275c85d2e7dcd696edc1160eee # v1.1.0
        with:
          k3d-tag: v${{ env.K3D_VERSION }}
          skip-creation: true
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Install tools
        run: |
          ARCH=$(uname -m)
          case $ARCH in
            aarch64) ARCH="arm64";;
            x86_64) ARCH="amd64";;
          esac

          HELMFILE_ASSET="helmfile_${HELMFILE_VERSION}_linux_${ARCH}.tar.gz"
          HELMFILE_RELEASE="https://github.com/helmfile/helmfile/releases/download/v${HELMFILE_VERSION}"
          KAPP_ASSET="kapp-linux-${ARCH}"
          KAPP_RELEASE="https://github.com/carvel-dev/kapp/releases/download/v${KAPP_VERSION}"

          curl --proto "=https" -fsSL "${HELMFILE_RELEASE}/${HELMFILE_ASSET}" -o "/tmp/${HELMFILE_ASSET}"
          curl --proto "=https" -fsSL "${HELMFILE_RELEASE}/helmfile_${HELMFILE_VERSION}_checksums.txt" \
            | awk -v asset="$HELMFILE_ASSET" '$2 == asset { print $1 "  /tmp/" asset }' \
            | sha256sum --check --strict -
          tar -xzf "/tmp/${HELMFILE_ASSET}" -C /tmp helmfile

          curl --proto "=https" -fsSL "${KAPP_RELEASE}/${KAPP_ASSET}" -o /tmp/kapp
          curl --proto "=https" -fsSL "${KAPP_RELEASE}/checksums.txt" \
            | awk -v asset="$KAPP_ASSET" '$2 == asset { print $1 "  /tmp/kapp" }' \
            | sha256sum --check --strict -

          sudo install -m 0755 /tmp/helmfile /tmp/kapp /usr/local/bin/

      - name: Install Hurl
        run: |
          HURL_ASSET="hurl_${HURL_VERSION}_amd64.deb"
          HURL_RELEASE="https://github.com/Orange-OpenSource/hurl/releases/download/${HURL_VERSION}"

          curl --proto "=https" -fsSL "${HURL_RELEASE}/${HURL_ASSET}" -o "/tmp/${HURL_ASSET}"
          curl --proto "=https" -fsSL "${HURL_RELEASE}/${HURL_ASSET}.sha256" \
            | awk -v asset="/tmp/${HURL_ASSET}" '{ print $1 "  " asset }' \
            | sha256sum --check --strict -

          sudo apt-get install -y "/tmp/${HURL_ASSET}"

      - name: Install BATS
        run: |
          git clone --quiet --depth 1 --revision "$BATS_COMMIT" \
            https://github.com/bats-core/bats-core.git /tmp/bats-core

          sudo /tmp/bats-core/install.sh /usr/local

      - name: Prepare cluster
        run: deploy/kubernetes/tests/init.sh

      - name: Run tests
        run: |
          hurl --test --insecure \
            --resolve kanae:443:127.0.0.1 --resolve kanae:80:127.0.0.1 \
            --variables-file deploy/kubernetes/tests/vars.env \
            --secrets-file deploy/kubernetes/tests/secrets.env \
            deploy/kubernetes/tests/scenarios/*.hurl

      - name: Run cluster tests
        run: bats --verbose-run deploy/kubernetes/tests

      - name: Dump cluster state
        if: ${{ failure() }}
        run: deploy/kubernetes/tests/scripts/dump.sh

      - name: Clean up cluster
        run: k3d cluster delete --config deploy/kubernetes/k3d.yml

  Render:
    name: Render
    runs-on: ubuntu-24.04

    needs: Changes

    # 29139614 is the renovate[bot] account
    if: >-
      ${{ needs.Changes.outputs.chart == 'true'
      && github.event_name == 'pull_request'
      && github.event.pull_request.user.id == 29139614
      && github.event.pull_request.head.repo.full_name == github.repository }}

    permissions:
      contents: read

    env:
      HELM_VERSION: 4.2.4

    steps:
      - name: Generate automation token
        id: app_token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3
        with:
          client-id: ${{ secrets.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: kanae
          permission-contents: write

      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.head_ref }}
          token: ${{ steps.app_token.outputs.token }}

      - name: Install Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Render changes
        run: |
          rm -f deploy/kubernetes/dist/*.yml
          helm template kanae deploy/kubernetes/src --namespace kanae \
            | yq --no-doc 'select(.kind != null and .kind != "Secret")' \
              -s '"deploy/kubernetes/dist/\(.kind | downcase)-\(.metadata.name).yml"'

      - name: Look up the bot's user ID
        id: bot_user
        env:
          GH_TOKEN: ${{ steps.app_token.outputs.token }}
          APP_SLUG: ${{ steps.app_token.outputs.app-slug }}
        run: echo "id=$(gh api "/users/$APP_SLUG[bot]" --jq .id)" >> "$GITHUB_OUTPUT"

      - name: Commit the render
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Render Kubernetes changes
          file_pattern: deploy/kubernetes/dist
          commit_user_name: ${{ steps.app_token.outputs.app-slug }}[bot]
          commit_user_email: ${{ steps.bot_user.outputs.id }}+${{ steps.app_token.outputs.app-slug }}[bot]@users.noreply.github.com
