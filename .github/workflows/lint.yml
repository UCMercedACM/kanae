name: Lint
on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

jobs:
  Check:
    name: Check (${{ matrix.version }})
    runs-on: ubuntu-26.04

    strategy:
      fail-fast: false
      matrix:
        version: ["3.12", "3.13", "3.14"]

    env:
      UV_NO_DEV: true
      UV_NO_DEFAULT_GROUPS: true

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python ${{ matrix.version }}
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: ${{ matrix.version }}

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --group lint

      - name: Check typing
        run: |
          uv run --frozen ty check src --error-on-warning

      - name: Check codebase
        run: |
          uv run --frozen ruff check src --exit-non-zero-on-fix

      - name: Check for formatting
        run: |
          uv run --frozen ruff format src --check

  YAML:
    name: Check YAML
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    env:
      UV_NO_DEV: true
      UV_NO_DEFAULT_GROUPS: true

      DPRINT_VERSION: 0.57.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: "3.x"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "latest"
          enable-cache: true

      - name: Install dependencies
        run: |
          uv sync --frozen --group lint

      - name: Check YAML files
        run: |
          uv run --frozen yamllint --strict .

      - name: Check for formatting
        uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5
        with:
          dprint-version: ${{ env.DPRINT_VERSION }}
          args: "'**/*.{yml,yaml}' '**/.yamllint'"

  Configs:
    name: Check Configs
    runs-on: ubuntu-26.04

    defaults:
      run:
        working-directory: ${{ github.workspace }}

    env:
      DPRINT_VERSION: 0.57.0

    steps:
      - name: Checkout Repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Check for formatting
        uses: dprint/check@7dc032d8874778fc024f6f9b4a7e6d896782c330 # v2.5
        with:
          dprint-version: ${{ env.DPRINT_VERSION }}
          args: "**/*.{json,toml}"
