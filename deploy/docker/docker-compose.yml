name: kanae

include:
  - path: ../../docker/ory/docker-compose.prod.yml
    project_directory: ../../docker/ory

services:
  kanae:
    container_name: kanae
    image: ghcr.io/ucmercedacm/kanae:latest@sha256:368bd2951dffc1025ed9d0de16e977ec2c38451a0b74245f76a886eae57c8b19
    environment:
      GRANIAN_WORKERS: ${KANAE_WORKERS:-4}
    volumes:
      # Do not edit the next line. If you want to change the path of the configuration file, please edit the CONFIG_LOCATION variable
      - ${CONFIG_LOCATION}:/kanae/config.yml
    ports:
      - 8000:8000
      - 9555:9555
    networks:
      - default
      - db_bridge
    depends_on:
      database:
        condition: service_healthy
        restart: true
      valkey:
        condition: service_healthy
        restart: true
      kratos:
        condition: service_started
        restart: true
      keto:
        condition: service_started
        restart: true
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: curl -fsS --max-time 2 http://127.0.0.1:8000
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

  database:
    container_name: kanae_postgres
    build:
      context: ../../docker/ory
      dockerfile_inline: |
        FROM postgres:18
        COPY init.sh /docker-entrypoint-initdb.d/init.sh
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - 5432:5432
    networks:
      - default
      - db_bridge
    volumes:
      - database:/var/lib/postgresql/18/docker
    healthcheck:
      test: pg_isready --dbname='${DB_DATABASE_NAME}' --username='${DB_USERNAME}' || exit 1; Chksum="$$(psql --dbname='${DB_DATABASE_NAME}' --username='${DB_USERNAME}' --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m

  valkey:
    container_name: kanae_valkey
    image: valkey/valkey:9-alpine@sha256:ccfa19b0d743e48927e1c8c14e39e0acb97b5cea347fef0bfe340247fea920cd
    command: >
      valkey-server --maxmemory 256mb --maxmemory-policy volatile-ttl
    ports:
      - 6379:6379
    networks:
      - default
    healthcheck:
      test: valkey-cli PING || exit 1
      interval: 10s
      timeout: 3s
      start_period: 10s
      start_interval: 3s

  migrate:
    container_name: kanae_migrate
    image: arigaio/atlas:latest@sha256:d08183f70aa37ae1668ded9e3d88a028c867824168cd2262e69874d59bcff0a0
    command: >
      schema apply
      --auto-approve
      --to "file://schema.sql"
      --url "postgres://${DB_USERNAME}:${DB_PASSWORD}@database:5432/${DB_DATABASE_NAME}?search_path=public&sslmode=disable"
      --dev-url "postgres://${DB_USERNAME}:${DB_PASSWORD}@database:5432/postgres?search_path=public&sslmode=disable"
    networks:
      - db_bridge
      - default
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ../../src/schema.sql:/schema.sql

volumes:
  database:

networks:
  db_bridge:
    driver: bridge
