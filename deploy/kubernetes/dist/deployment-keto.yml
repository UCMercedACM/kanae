# Source: kanae/templates/keto.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: keto
  namespace: kanae
  labels:
    app: keto
    app.kubernetes.io/name: keto
    app.kubernetes.io/instance: kanae
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: keto
    app.kubernetes.io/part-of: kanae
    app.kubernetes.io/managed-by: Helm
  annotations:
    kapp.k14s.io/change-group: "kanae/services"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/schemas"
    kapp.k14s.io/change-rule.teardown: "delete before deleting kanae/databases"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: keto
  template:
    metadata:
      labels:
        app: keto
        app.kubernetes.io/name: keto
        app.kubernetes.io/instance: kanae
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/component: keto
        app.kubernetes.io/part-of: kanae
        app.kubernetes.io/managed-by: Helm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        seLinuxOptions:
          type: container_t
      containers:
        - name: keto
          image: "oryd/keto:v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - -c
            - /etc/config/keto.yml
            - -c
            - /etc/secrets/dsn.yml
          ports:
            - name: read
              containerPort: 4466
            - name: write
              containerPort: 4467
          readinessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:4466/health/ready"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:4466/health/alive"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: keto-config
        - name: secrets
          secret:
            secretName: keto-db
            defaultMode: 0440
            items:
              - key: dsn.yml
                path: dsn.yml
        - name: tmp
          emptyDir: {}
