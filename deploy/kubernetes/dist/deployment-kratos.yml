# Source: kanae/templates/kratos.yml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: kratos
  namespace: kanae
  labels:
    app: kratos
    app.kubernetes.io/name: kratos
    app.kubernetes.io/instance: kanae
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: kratos
    app.kubernetes.io/part-of: kanae
    app.kubernetes.io/managed-by: Helm
  annotations:
    kapp.k14s.io/change-group: "kanae/services"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/schemas"
    kapp.k14s.io/change-rule.teardown: "delete before deleting kanae/databases"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: kratos
  template:
    metadata:
      labels:
        app: kratos
        app.kubernetes.io/name: kratos
        app.kubernetes.io/instance: kanae
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/component: kratos
        app.kubernetes.io/part-of: kanae
        app.kubernetes.io/managed-by: Helm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 101
        fsGroup: 101
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        seLinuxOptions:
          type: container_t
      containers:
        - name: kratos
          image: "oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643"
          imagePullPolicy: IfNotPresent
          args:
            - serve
            - -c
            - /etc/secrets/kratos.yml
            - -c
            - /etc/secrets/overrides.yml
            - --watch-courier
          env:
            - name: COOKIES_SECURE
              value: "true"
          ports:
            - name: public
              containerPort: 4433
            - name: admin
              containerPort: 4434
          readinessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:4433/health/ready"]
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            exec:
              command: ["wget", "-q", "--spider", "http://127.0.0.1:4433/health/alive"]
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 100m
              ephemeral-storage: 64Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
            - name: secrets
              mountPath: /etc/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          configMap:
            name: kratos-config
            items:
              - key: identity.schema.json
                path: identity.schema.json
              - key: payload.jsonnet
                path: hooks/payload.jsonnet
              - key: recovery.valid.email.subject.gotmpl
                path: templates/recovery/valid/email.subject.gotmpl
              - key: recovery.valid.email.body.gotmpl
                path: templates/recovery/valid/email.body.gotmpl
              - key: recovery.valid.email.body.plaintext.gotmpl
                path: templates/recovery/valid/email.body.plaintext.gotmpl
        - name: secrets
          secret:
            secretName: kratos-db
            defaultMode: 0440
            items:
              - key: kratos.yml
                path: kratos.yml
              - key: overrides.yml
                path: overrides.yml
        - name: tmp
          emptyDir: {}
