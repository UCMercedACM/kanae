# Source: kanae/templates/jobs-migrate.yml
apiVersion: batch/v1
kind: Job
metadata:
  name: kanae-migrate
  namespace: kanae
  labels:
    app: kanae-migrate
    app.kubernetes.io/name: kanae-migrate
    app.kubernetes.io/instance: kanae
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: kanae-migrate
    app.kubernetes.io/part-of: kanae
    app.kubernetes.io/managed-by: Helm
  annotations:
    kapp.k14s.io/versioned: ""
    kapp.k14s.io/num-versions: "2"
    kapp.k14s.io/change-group: "kanae/schemas"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/databases"
spec:
  backoffLimit: 3
  template:
    metadata:
      labels:
        app: kanae-migrate
        app.kubernetes.io/name: kanae-migrate
        app.kubernetes.io/instance: kanae
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/component: kanae-migrate
        app.kubernetes.io/part-of: kanae
        app.kubernetes.io/managed-by: Helm
      annotations:
        checksum/schema: 6e12ba6ad4890f12916aec57bfedd96f072e675a7995a3bf559dc3f0016dd331
        checksum/atlas: 6b3f9ecc69c7feb7953612f632ac18997e9cdf89fe1bd14884a093e61e229a6c
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        seLinuxOptions:
          type: container_t
      containers:
        - name: atlas
          image: "arigaio/atlas:1.3.3-distroless@sha256:07f3f92fa46e684ed789d5ef344a25494a4fa6844ef1ea1fa4e138522c2c37ac"
          imagePullPolicy: IfNotPresent
          args:
            - schema
            - apply
            - --auto-approve
            - -c
            - "file:///etc/atlas/atlas.hcl"
            - --env
            - prod
            - --var
            - host=database
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: schema
              mountPath: /etc/atlas
              readOnly: true
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: schema
          configMap:
            name: kanae-schema
        - name: secrets
          secret:
            secretName: kanae-migrate-db
            defaultMode: 0440
            items:
              - key: KANAE_MIGRATE_PASSWORD
                path: KANAE_MIGRATE_PASSWORD
        - name: tmp
          emptyDir: {}
