# Source: kanae/templates/postgres.yml
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: kanae
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
data:
  pg_hba.conf: |
    # TYPE  DATABASE        USER              ADDRESS         METHOD

    # Usage of unix socket is used for administrative work
    # I.e., `docker exec ... psql -U postgres` and `kubectl exec`
    local   all             all                               trust

    # Ban any access of superusers
    host    all             postgres          all             reject

    # Loopback connections require passwords
    host    all             all               127.0.0.1/32    scram-sha-256
    host    all             all               ::1/128         scram-sha-256

    # All other operations
    host    all             all               all             scram-sha-256
