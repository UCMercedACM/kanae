# Source: kanae/templates/postgres.yml
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-checksum
  namespace: kanae
  labels:
    app: postgres-checksum
    app.kubernetes.io/name: postgres-checksum
    app.kubernetes.io/instance: kanae
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: postgres-checksum
    app.kubernetes.io/part-of: kanae
    app.kubernetes.io/managed-by: Helm
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting kanae/databases"
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-checksum
            app.kubernetes.io/name: postgres-checksum
            app.kubernetes.io/instance: kanae
            app.kubernetes.io/version: "0.1.0"
            app.kubernetes.io/component: postgres-checksum
            app.kubernetes.io/part-of: kanae
            app.kubernetes.io/managed-by: Helm
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              type: container_t
          containers:
            - name: checksum
              image: "postgres:18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722"
              imagePullPolicy: IfNotPresent
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  psql --tuples-only --no-align \
                    --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database' \
                    | tee /dev/stderr | grep -qx 0
              env:
                - name: PGSERVICEFILE
                  value: /run/secrets/pg_service.conf
                - name: PGSERVICE
                  value: checksum
                - name: PGCONNECT_TIMEOUT
                  value: "10"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                  ephemeral-storage: 32Mi
                limits:
                  memory: 64Mi
                  ephemeral-storage: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: secrets
                  mountPath: /run/secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: secrets
              secret:
                secretName: postgres-monitor-db
                defaultMode: 0440
                items:
                  - key: pg_service.conf
                    path: pg_service.conf
            - name: tmp
              emptyDir: {}
