# Source: kanae/templates/postgres.yml
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
  namespace: kanae
  labels:
    app: database
    app.kubernetes.io/name: database
    app.kubernetes.io/instance: kanae
    app.kubernetes.io/version: "0.1.0"
    app.kubernetes.io/component: database
    app.kubernetes.io/part-of: kanae
    app.kubernetes.io/managed-by: Helm
  annotations:
    kapp.k14s.io/change-group: "kanae/databases"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/config"
spec:
  serviceName: database
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
        app.kubernetes.io/name: database
        app.kubernetes.io/instance: kanae
        app.kubernetes.io/version: "0.1.0"
        app.kubernetes.io/component: database
        app.kubernetes.io/part-of: kanae
        app.kubernetes.io/managed-by: Helm
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        seLinuxOptions:
          type: container_t
      initContainers:
        - name: check-version
          image: "postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280"
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              shopt -s nullglob

              if [[ -f $PGDATA/PG_VERSION ]]; then
                echo "found a PostgreSQL $PG_MAJOR cluster in $PGDATA"
                exit 0
              fi

              clusters=(/var/lib/postgresql/*/docker/PG_VERSION)

              if ((${#clusters[@]})); then
                printf '%s\n' \
                  "$PGDATA does not exist, but ${clusters[0]} does." \
                  "This volume holds a cluster from another major version, and" \
                  "starting would initdb an empty one beside it. Run" \
                  "pg_upgrade --link into $PGDATA, or restore into it, first." >&2
                exit 1
              fi

              echo "empty volume, the entrypoint will initdb $PGDATA"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
              ephemeral-storage: 32Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: "postgres:18@sha256:4ef4dbc939d61acea57712655ddb4b4ab27419c913f94cca0cd57cb3ea3c2280"
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - "-c"
            - hba_file=/etc/postgresql/pg_hba.conf
            - "-c"
            - max_connections=150
          env:
            - name: POSTGRES_DB
              value: kanae
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/DB_PASSWORD
            - name: KANAE_PASSWORD_FILE
              value: /run/secrets/KANAE_PASSWORD
            - name: KRATOS_PASSWORD_FILE
              value: /run/secrets/KRATOS_PASSWORD
            - name: KETO_PASSWORD_FILE
              value: /run/secrets/KETO_PASSWORD
            - name: POSTGRES_MONITOR_PASSWORD_FILE
              value: /run/secrets/POSTGRES_MONITOR_PASSWORD
            - name: KANAE_MIGRATE_PASSWORD_FILE
              value: /run/secrets/KANAE_MIGRATE_PASSWORD
            - name: KRATOS_MIGRATE_PASSWORD_FILE
              value: /run/secrets/KRATOS_MIGRATE_PASSWORD
            - name: KETO_MIGRATE_PASSWORD_FILE
              value: /run/secrets/KETO_MIGRATE_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "--username=postgres_monitor", "--dbname=postgres"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "--username=postgres_monitor", "--dbname=postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
              ephemeral-storage: 128Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: hba
              mountPath: /etc/postgresql
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: database-data
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: hba
          configMap:
            name: postgres-hba
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: postgres-db
                  items:
                    - key: DB_PASSWORD
                      path: DB_PASSWORD
              - secret:
                  name: kanae-db
                  items:
                    - key: KANAE_PASSWORD
                      path: KANAE_PASSWORD
              - secret:
                  name: kratos-db
                  items:
                    - key: KRATOS_PASSWORD
                      path: KRATOS_PASSWORD
              - secret:
                  name: keto-db
                  items:
                    - key: KETO_PASSWORD
                      path: KETO_PASSWORD
              - secret:
                  name: postgres-monitor-db
                  items:
                    - key: POSTGRES_MONITOR_PASSWORD
                      path: POSTGRES_MONITOR_PASSWORD
              - secret:
                  name: kanae-migrate-db
                  items:
                    - key: KANAE_MIGRATE_PASSWORD
                      path: KANAE_MIGRATE_PASSWORD
              - secret:
                  name: kratos-migrate-db
                  items:
                    - key: KRATOS_MIGRATE_PASSWORD
                      path: KRATOS_MIGRATE_PASSWORD
              - secret:
                  name: keto-migrate-db
                  items:
                    - key: KETO_MIGRATE_PASSWORD
                      path: KETO_MIGRATE_PASSWORD
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
