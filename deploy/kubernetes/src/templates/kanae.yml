apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceNames.kanae }}
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.serviceNames.kanae }}
  ports:
    - name: http
      port: 8000
      targetPort: http
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Values.serviceNames.kanae }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.serviceNames.kanae }}
    app.kubernetes.io/name: {{ .Values.serviceNames.kanae }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.Version | quote }}
    app.kubernetes.io/component: {{ .Values.serviceNames.kanae }}
    app.kubernetes.io/part-of: kanae
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    kapp.k14s.io/change-group: "kanae/services"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/schemas"
    kapp.k14s.io/change-rule.teardown: "delete before deleting kanae/databases"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 0
      maxUnavailable: 1
  selector:
    matchLabels:
      app: {{ .Values.serviceNames.kanae }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceNames.kanae }}
        app.kubernetes.io/name: {{ .Values.serviceNames.kanae }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.Version | quote }}
        app.kubernetes.io/component: {{ .Values.serviceNames.kanae }}
        app.kubernetes.io/part-of: kanae
        app.kubernetes.io/managed-by: {{ .Release.Service }}
      annotations:
        checksum/config: {{ include "kanae.config.public" . | sha256sum }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        seLinuxOptions:
          type: container_t
      containers:
        - name: kanae
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          env:
            - name: GRANIAN_WORKERS
              value: {{ .Values.kanae.granianWorkers | quote }}
          ports:
            - name: http
              containerPort: 8000
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 3
          resources:
            requests:
              memory: 512Mi
              cpu: 250m
              ephemeral-storage: 64Mi
            limits:
              memory: 512Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /kanae/config.yml
              subPath: config.yml
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: config
          secret:
            secretName: kanae-config
            defaultMode: 0440
            items:
              - key: config.yml
                path: config.yml
        - name: tmp
          emptyDir: {}
