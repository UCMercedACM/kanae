apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: {{ .Values.serviceNames.kanae }}
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"

{{- $issuer := pick .Values.gateway.tls.issuers .Values.gateway.tls.provider }}
spec:
  {{- toYaml $issuer | nindent 2 }}
  {{- if hasKey $issuer "acme" }}
    solvers:
      - http01:
          gatewayHTTPRoute:
            parentRefs:
              - kind: Gateway
                name: {{ .Values.serviceNames.kanae }}
                namespace: {{ .Values.namespace }}
                sectionName: http
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.serviceNames.kanae }}
  namespace: {{ .Values.namespace }}
  annotations:
    cert-manager.io/issuer: {{ .Values.serviceNames.kanae }}
    kapp.k14s.io/change-rule: "upsert after upserting kanae/services"
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: https
      protocol: HTTPS
      port: 443
      hostname: {{ .Values.gateway.hostname | quote }}
      tls:
        mode: Terminate
        certificateRefs:
          - kind: Secret
            name: {{ .Values.serviceNames.kanae }}-tls
      allowedRoutes:
        namespaces:
          from: Same
    - name: http
      protocol: HTTP
      port: 80
      hostname: {{ .Values.gateway.hostname | quote }}
      allowedRoutes:
        namespaces:
          from: Same
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.serviceNames.kanae }}
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting kanae/services"
spec:
  parentRefs:
    - name: {{ .Values.serviceNames.kanae }}
      sectionName: https
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /auth
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      timeouts:
        request: 45s
      backendRefs:
        - name: {{ .Values.serviceNames.kratos }}
          port: 4433
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ .Values.serviceNames.kanae }}
          port: 8000
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.serviceNames.kanae }}-https-redirect
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting kanae/services"
spec:
  parentRefs:
    - name: {{ .Values.serviceNames.kanae }}
      sectionName: http
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      filters:
        - type: RequestRedirect
          requestRedirect:
            scheme: https
            statusCode: 308
---
apiVersion: gateway.envoyproxy.io/v1alpha1
kind: BackendTrafficPolicy
metadata:
  name: {{ .Values.serviceNames.kratos }}-auth-limiter
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting kanae/services"
spec:
  targetRefs:
    - group: gateway.networking.k8s.io
      kind: HTTPRoute
      name: {{ .Values.serviceNames.kanae }}
  rateLimit:
    type: Local
    local:
      rules:
        - clientSelectors:
            - methods:
                - value: POST
              path:
                type: PathPrefix
                value: /auth/self-service/registration
          limit:
            requests: {{ .Values.gateway.authRateLimit.requestsPerSecond }}
            unit: Second
        - clientSelectors:
            - methods:
                - value: POST
              path:
                type: PathPrefix
                value: /auth/self-service/login
          limit:
            requests: {{ .Values.gateway.authRateLimit.requestsPerSecond }}
            unit: Second
