apiVersion: v1
kind: ConfigMap
metadata:
  name: kanae-schema
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
data:
  schema.sql: |
    {{- include "kanae.file" (list . "schema.sql") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-config
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
data:
  kratos.yml: |
    {{- include "kanae.file" (list . "kratos/kratos.prod.yml") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keto-config
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
data:
  keto.yml: |
    {{- include "kanae.file" (list . "keto/keto.yml") | nindent 4 }}
  namespaces.keto.ts: |
    {{- include "kanae.file" (list . "keto/namespaces.keto.ts") | nindent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kanae-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/versioned: ""
    kapp.k14s.io/num-versions: "2"
    kapp.k14s.io/change-group: "kanae/schemas"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/databases"
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        checksum/schema: {{ include "kanae.file" (list . "schema.sql") | sha256sum }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
      containers:
        - name: atlas
          image: "{{ .Values.migrate.atlas.image.repository }}:{{ .Values.migrate.atlas.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - schema
            - apply
            - --auto-approve
            - --to
            - "file:///etc/atlas/schema.sql"
            - --url
            - {{ include "kanae.atlasUrl" . | quote }}
            - --dev-url
            - {{ include "kanae.atlasDevUrl" . | quote }}
          env:
            - name: KANAE_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kanae-migrate-db
                  key: KANAE_MIGRATE_PASSWORD
          resources:
            requests:
              memory: 256Mi
              cpu: 250m
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: schema
              mountPath: /etc/atlas
              readOnly: true
      volumes:
        - name: schema
          configMap:
            name: kanae-schema
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kratos-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/versioned: ""
    kapp.k14s.io/num-versions: "2"
    kapp.k14s.io/change-group: "kanae/schemas"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/databases"
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        checksum/config: {{ include "kanae.file" (list . "kratos/kratos.prod.yml") | sha256sum }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10000
        runAsGroup: 101
      containers:
        - name: kratos
          image: "{{ .Values.ory.kratos.image.repository }}:{{ .Values.ory.kratos.image.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["migrate", "sql", "-c", "/etc/config/kratos.yml", "--read-from-env", "--yes"]
          env:
            - name: KRATOS_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kratos-migrate-db
                  key: KRATOS_MIGRATE_PASSWORD
            - name: DSN
              value: {{ include "kanae.kratosMigrateDsn" . | quote }}
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: kratos-config
---
apiVersion: batch/v1
kind: Job
metadata:
  name: keto-migrate
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/versioned: ""
    kapp.k14s.io/num-versions: "2"
    kapp.k14s.io/change-group: "kanae/schemas"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/databases"
spec:
  backoffLimit: 3
  template:
    metadata:
      annotations:
        checksum/config: {{ printf "%s\x00%s" (include "kanae.file" (list . "keto/keto.yml")) (include "kanae.file" (list . "keto/namespaces.keto.ts")) | sha256sum }}
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 100
        runAsGroup: 101
      containers:
        - name: keto
          image: "{{ .Values.ory.keto.image.repository }}:{{ .Values.ory.keto.image.tag }}"
          imagePullPolicy: IfNotPresent
          args: ["migrate", "up", "-c", "/etc/config/keto.yml", "--yes"]
          env:
            - name: KETO_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keto-migrate-db
                  key: KETO_MIGRATE_PASSWORD
            - name: DSN
              value: {{ include "kanae.ketoMigrateDsn" . | quote }}
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
              ephemeral-storage: 64Mi
            limits:
              memory: 256Mi
              ephemeral-storage: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: config
              mountPath: /etc/config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: keto-config
