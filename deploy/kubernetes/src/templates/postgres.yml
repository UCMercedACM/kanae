apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceNames.database }}
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.serviceNames.database }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
data:
  init.sh: |
    {{- include "kanae.file" (list . "postgres/init.sh") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
data:
  pg_hba.conf: |
    {{- include "kanae.file" (list . "postgres/pg_hba.conf") | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-data
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/delete-strategy: "orphan"
    kapp.k14s.io/change-group: "kanae/databases"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/config"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.serviceNames.database }}
  namespace: {{ .Values.namespace }}
  labels:
    app: {{ .Values.serviceNames.database }}
    app.kubernetes.io/name: {{ .Values.serviceNames.database }}
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.Version | quote }}
    app.kubernetes.io/component: {{ .Values.serviceNames.database }}
    app.kubernetes.io/part-of: kanae
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    kapp.k14s.io/change-group: "kanae/databases"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/config"
spec:
  serviceName: {{ .Values.serviceNames.database }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.serviceNames.database }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceNames.database }}
        app.kubernetes.io/name: {{ .Values.serviceNames.database }}
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/version: {{ .Chart.Version | quote }}
        app.kubernetes.io/component: {{ .Values.serviceNames.database }}
        app.kubernetes.io/part-of: kanae
        app.kubernetes.io/managed-by: {{ .Release.Service }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
        seLinuxOptions:
          type: container_t
      initContainers:
        - name: check-version
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              shopt -s nullglob

              if [[ -f $PGDATA/PG_VERSION ]]; then
                echo "found a PostgreSQL $PG_MAJOR cluster in $PGDATA"
                exit 0
              fi

              clusters=(/var/lib/postgresql/*/docker/PG_VERSION)

              if ((${#clusters[@]})); then
                printf '%s\n' \
                  "$PGDATA does not exist, but ${clusters[0]} does." \
                  "This volume holds a cluster from another major version, and" \
                  "starting would initdb an empty one beside it. Run" \
                  "pg_upgrade --link into $PGDATA, or restore into it, first." >&2
                exit 1
              fi

              echo "empty volume, the entrypoint will initdb $PGDATA"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
              ephemeral-storage: 32Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - "-c"
            - hba_file=/etc/postgresql/pg_hba.conf
            - "-c"
            - max_connections=150
          env:
            - name: POSTGRES_DB
              value: kanae
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: POSTGRES_PASSWORD_FILE
              value: /run/secrets/DB_PASSWORD
            - name: KANAE_PASSWORD_FILE
              value: /run/secrets/KANAE_PASSWORD
            - name: KRATOS_PASSWORD_FILE
              value: /run/secrets/KRATOS_PASSWORD
            - name: KETO_PASSWORD_FILE
              value: /run/secrets/KETO_PASSWORD
            - name: POSTGRES_MONITOR_PASSWORD_FILE
              value: /run/secrets/POSTGRES_MONITOR_PASSWORD
            - name: KANAE_MIGRATE_PASSWORD_FILE
              value: /run/secrets/KANAE_MIGRATE_PASSWORD
            - name: KRATOS_MIGRATE_PASSWORD_FILE
              value: /run/secrets/KRATOS_MIGRATE_PASSWORD
            - name: KETO_MIGRATE_PASSWORD_FILE
              value: /run/secrets/KETO_MIGRATE_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          startupProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "--username=postgres_monitor", "--dbname=postgres"]
            periodSeconds: 5
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            exec:
              command: ["pg_isready", "-h", "127.0.0.1", "--username=postgres_monitor", "--dbname=postgres"]
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
              ephemeral-storage: 128Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: secrets
              mountPath: /run/secrets
              readOnly: true
            - name: hba
              mountPath: /etc/postgresql
              readOnly: true
            - name: run
              mountPath: /var/run/postgresql
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: database-data
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: hba
          configMap:
            name: postgres-hba
        - name: secrets
          projected:
            defaultMode: 0440
            sources:
              - secret:
                  name: postgres-db
                  items:
                    - key: DB_PASSWORD
                      path: DB_PASSWORD
              - secret:
                  name: kanae-db
                  items:
                    - key: KANAE_PASSWORD
                      path: KANAE_PASSWORD
              - secret:
                  name: kratos-db
                  items:
                    - key: KRATOS_PASSWORD
                      path: KRATOS_PASSWORD
              - secret:
                  name: keto-db
                  items:
                    - key: KETO_PASSWORD
                      path: KETO_PASSWORD
              - secret:
                  name: postgres-monitor-db
                  items:
                    - key: POSTGRES_MONITOR_PASSWORD
                      path: POSTGRES_MONITOR_PASSWORD
              - secret:
                  name: kanae-migrate-db
                  items:
                    - key: KANAE_MIGRATE_PASSWORD
                      path: KANAE_MIGRATE_PASSWORD
              - secret:
                  name: kratos-migrate-db
                  items:
                    - key: KRATOS_MIGRATE_PASSWORD
                      path: KRATOS_MIGRATE_PASSWORD
              - secret:
                  name: keto-migrate-db
                  items:
                    - key: KETO_MIGRATE_PASSWORD
                      path: KETO_MIGRATE_PASSWORD
        - name: run
          emptyDir: {}
        - name: tmp
          emptyDir: {}
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-checksum
  namespace: {{ .Values.namespace }}
  labels:
    app: postgres-checksum
    app.kubernetes.io/name: postgres-checksum
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/version: {{ .Chart.Version | quote }}
    app.kubernetes.io/component: postgres-checksum
    app.kubernetes.io/part-of: kanae
    app.kubernetes.io/managed-by: {{ .Release.Service }}
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting kanae/databases"
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: postgres-checksum
            app.kubernetes.io/name: postgres-checksum
            app.kubernetes.io/instance: {{ .Release.Name }}
            app.kubernetes.io/version: {{ .Chart.Version | quote }}
            app.kubernetes.io/component: postgres-checksum
            app.kubernetes.io/part-of: kanae
            app.kubernetes.io/managed-by: {{ .Release.Service }}
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
            fsGroup: 999
            fsGroupChangePolicy: OnRootMismatch
            seccompProfile:
              type: RuntimeDefault
            seLinuxOptions:
              type: container_t
          containers:
            - name: checksum
              image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  psql --tuples-only --no-align \
                    --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database' \
                    | tee /dev/stderr | grep -qx 0
              env:
                - name: PGSERVICEFILE
                  value: /run/secrets/pg_service.conf
                - name: PGSERVICE
                  value: checksum
                - name: PGCONNECT_TIMEOUT
                  value: "10"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                  ephemeral-storage: 32Mi
                limits:
                  memory: 64Mi
                  ephemeral-storage: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop: ["ALL"]
              volumeMounts:
                - name: secrets
                  mountPath: /run/secrets
                  readOnly: true
                - name: tmp
                  mountPath: /tmp
          volumes:
            - name: secrets
              secret:
                secretName: postgres-monitor-db
                defaultMode: 0440
                items:
                  - key: pg_service.conf
                    path: pg_service.conf
            - name: tmp
              emptyDir: {}
