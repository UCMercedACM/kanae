apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.serviceNames.database }}
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
spec:
  type: ClusterIP
  selector:
    app: {{ .Values.serviceNames.database }}
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
data:
  init.sh: |
    {{- include "kanae.file" (list . "postgres/init.sh") | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-hba
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/config"
data:
  pg_hba.conf: |
    {{- include "kanae.file" (list . "postgres/pg_hba.conf") | nindent 4 }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-data
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/delete-strategy: "orphan"
    kapp.k14s.io/change-group: "kanae/databases"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/config"
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgres.storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ .Values.serviceNames.database }}
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-group: "kanae/databases"
    kapp.k14s.io/change-rule: "upsert after upserting kanae/config"
spec:
  serviceName: {{ .Values.serviceNames.database }}
  replicas: 1
  selector:
    matchLabels:
      app: {{ .Values.serviceNames.database }}
  template:
    metadata:
      labels:
        app: {{ .Values.serviceNames.database }}
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      initContainers:
        - name: check-version
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: IfNotPresent
          command: ["bash", "-c"]
          args:
            - |
              set -euo pipefail
              shopt -s nullglob

              if [[ -f $PGDATA/PG_VERSION ]]; then
                echo "found a PostgreSQL $PG_MAJOR cluster in $PGDATA"
                exit 0
              fi

              clusters=(/var/lib/postgresql/*/docker/PG_VERSION)

              if ((${#clusters[@]})); then
                printf '%s\n' \
                  "$PGDATA does not exist, but ${clusters[0]} does." \
                  "This volume holds a cluster from another major version, and" \
                  "starting would initdb an empty one beside it. Run" \
                  "pg_upgrade --link into $PGDATA, or restore into it, first." >&2
                exit 1
              fi

              echo "empty volume, the entrypoint will initdb $PGDATA"
          resources:
            requests:
              memory: 64Mi
              cpu: 50m
              ephemeral-storage: 32Mi
            limits:
              memory: 64Mi
              ephemeral-storage: 64Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
      containers:
        - name: postgres
          image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - "-c"
            - hba_file=/etc/postgresql/pg_hba.conf
            - "-c"
            - max_connections=150
          env:
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-db
                  key: DB_PASSWORD
            - name: POSTGRES_DB
              value: kanae
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
            - name: KANAE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kanae-db
                  key: KANAE_PASSWORD
            - name: KRATOS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kratos-db
                  key: KRATOS_PASSWORD
            - name: KETO_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keto-db
                  key: KETO_PASSWORD
            - name: POSTGRES_MONITOR_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postgres-monitor-db
                  key: POSTGRES_MONITOR_PASSWORD
            - name: KANAE_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kanae-migrate-db
                  key: KANAE_MIGRATE_PASSWORD
            - name: KRATOS_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: kratos-migrate-db
                  key: KRATOS_MIGRATE_PASSWORD
            - name: KETO_MIGRATE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: keto-migrate-db
                  key: KETO_MIGRATE_PASSWORD
          ports:
            - name: postgres
              containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "--username=postgres_monitor", "--dbname=postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              memory: 1Gi
              cpu: 250m
              ephemeral-storage: 128Mi
            limits:
              memory: 1Gi
              ephemeral-storage: 512Mi
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql
            - name: initdb
              mountPath: /docker-entrypoint-initdb.d
            - name: hba
              mountPath: /etc/postgresql
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: database-data
        - name: initdb
          configMap:
            name: postgres-initdb
        - name: hba
          configMap:
            name: postgres-hba
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: postgres-checksum
  namespace: {{ .Values.namespace }}
  annotations:
    kapp.k14s.io/change-rule: "upsert after upserting kanae/databases"
spec:
  schedule: "17 4 * * *"
  concurrencyPolicy: Forbid
  startingDeadlineSeconds: 300
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            runAsGroup: 999
          containers:
            - name: checksum
              image: "{{ .Values.postgres.image.repository }}:{{ .Values.postgres.image.tag }}"
              imagePullPolicy: IfNotPresent
              command: ["bash", "-c"]
              args:
                - |
                  set -euo pipefail
                  psql --tuples-only --no-align \
                    --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database' \
                    | tee /dev/stderr | grep -qx 0
              env:
                - name: PGHOST
                  value: {{ .Values.serviceNames.database | quote }}
                - name: PGPORT
                  value: "5432"
                - name: PGUSER
                  value: "postgres_monitor"
                - name: PGDATABASE
                  value: "postgres"
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: postgres-monitor-db
                      key: POSTGRES_MONITOR_PASSWORD
                - name: PGCONNECT_TIMEOUT
                  value: "10"
              resources:
                requests:
                  memory: 64Mi
                  cpu: 50m
                  ephemeral-storage: 32Mi
                limits:
                  memory: 64Mi
                  ephemeral-storage: 64Mi
              securityContext:
                allowPrivilegeEscalation: false
                capabilities:
                  drop: ["ALL"]
