namespace: kanae

serviceNames:
  kanae: kanae
  database: database
  valkey: valkey
  kratos: kratos
  keto: keto

image:
  repository: ghcr.io/ucmercedacm/kanae
  tag: "0.3.1@sha256:368bd2951dffc1025ed9d0de16e977ec2c38451a0b74245f76a886eae57c8b19"
  pullPolicy: IfNotPresent

kanae:
  allowedOrigins:
    - "https://ucmacm.dev"
  limiter:
    enabled: true
  granianWorkers: 2

gateway:
  className: kanae
  hostname: api.ucmacm.dev
  authRateLimit:
    # Derived from the worst case the load study measured, not picked by hand.
    # See deploy/kubernetes/docs/kratos-load-study/KRATOS_MEMORY_LOAD_STUDY.md
    requestsPerSecond: 2
  tls:
    provider: acme
    issuers:
      acme:
        server: "https://acme-v02.api.letsencrypt.org/directory"
        email: "acm@ucmerced.edu"
        privateKeySecretRef:
          name: acme-account-key
      selfSigned: {}

postgres:
  image:
    repository: postgres
    tag: "18@sha256:5a5a84b19854a9ffaa54082c166ff4ec27473a361e496e5ea167f298f2da9722"
  storageClass: scw-bssd-retain
  storage: 10Gi

valkey:
  image:
    repository: valkey/valkey
    tag: "9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11"
  maxmemory: 128mb

ory:
  secureCookies: true
  publicOrigin: "https://ucmacm.dev"

  kratos:
    image:
      repository: oryd/kratos
      tag: "v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643"

  keto:
    image:
      repository: oryd/keto
      tag: "v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2"

migrate:
  atlas:
    image:
      repository: arigaio/atlas
      tag: "1.3.3-distroless@sha256:07f3f92fa46e684ed789d5ef344a25494a4fa6844ef1ea1fa4e138522c2c37ac"

# We do not render any secrets as we would be commiting secrets
# Rendering the secrets is the last step, and we pipe in our decrypted
# secrets in order to produce a final build that can be applied correctly
renderSecrets: false

secrets:
  dbPassword: ""
  valkeyPassword: ""
  kanaePassword: ""
  kratosPassword: ""
  ketoPassword: ""
  postgresMonitorPassword: ""
  kanaeMigratePassword: ""
  kratosMigratePassword: ""
  ketoMigratePassword: ""
  kratosSecretsCookie: ""
  kratosSecretsCipher: ""
  kratosWebhookMasterKey: ""
  kratosWebhookTokenRegistration: ""
  kratosWebhookTokenSettings: ""
  kratosSmtpUri: ""
  storageKeyId: ""
  storageSecretKey: ""
  borgPassphrase: ""
  borgS3AccessKey: ""
  borgS3SecretKey: ""
