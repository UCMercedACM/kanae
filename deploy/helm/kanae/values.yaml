# NOTE: Service names are deliberately fixed (kanae, database, valkey, kratos,
# keto) to match the compose service names hardcoded in kratos.prod.yml,
# keto.yml and config.yml. Do not templatize them.
#
# No resource requests/limits anywhere in this chart yet. Add them once there
# are real numbers from a running deployment, not guesses.

image:
  repository: ghcr.io/ucmercedacm/kanae
  tag: "0.3.1"          # pin; do not use :latest or :edge in prod
  pullPolicy: IfNotPresent

kanae:
  replicas: 1
  granianWorkers: 2      # NOT 8 as in deploy.dist.env

postgres:
  image: postgres:18
  # postgres:18 defaults PGDATA to /var/lib/postgresql/18/docker, which is what
  # the compose volume mounts.
  dataDir: /var/lib/postgresql/18/docker
  storage: 20Gi
  # MUST be a Retain-policy class — stock scw-bssd is reclaimPolicy: Delete, so
  # deleting the PVC would destroy the volume. Create the Retain variant once
  # per cluster; see the comment in templates/postgres.yaml.
  storageClass: scw-bssd-retain

valkey:
  image: valkey/valkey:9-alpine
  maxmemory: 256mb        # as compose; pure cache, no PVC

ory:
  kratosImage: oryd/kratos:v26.2.0
  ketoImage: oryd/keto:v26.2.0

migrate:
  atlasImage: arigaio/atlas:latest

seed:
  # scripts/seed/init.sh as a post-install Job (weight 10, after migrations).
  # Not an init container: it curls kanae's HTTP API, so gating kanae on it
  # deadlocks. Identities are @seed.test.local — preview data.
  enabled: false
  # Needs bash, curl, jq, openssl, psql, valkey-cli. compose builds this inline
  # in docker-compose.web.yml; Kubernetes cannot build, so publish an image.
  image: ghcr.io/ucmercedacm/kanae-seed:latest

backup:
  # Optional component on/off, same shape as seed.enabled — not a branch around
  # how to do something. Must be false locally: there is no borg repo, and the
  # pre-upgrade hook has backoffLimit 1, so it would fail every helm upgrade.
  enabled: true
  image: ghcr.io/borgmatic-collective/borgmatic:latest
  schedule: "17 9 * * *"          # 09:17 UTC daily
  # borgmatic's own config is maintained separately and supplied as a ConfigMap
  # with the values already injected — this chart only schedules it.
  configMap: borgmatic-config
  existingSecret: kanae-borg      # BORG_PASSPHRASE + repository backend creds

ingress:
  # Optional component on/off. False locally — needs the HAProxy controller.
  enabled: true
  # haproxytech/kubernetes-ingress, installed separately. Create the Kapsule
  # cluster with ingress: none so it does not also deploy nginx/traefik.
  # TLS is handled by the HAProxy config (certbot/letsencrypt), not here.
  className: haproxy
  host: api.ucmacm.dev

# TODO(sops): replaced by a templates/secrets.yaml rendering both Secrets from
# .Values.secrets.* supplied by secrets-prod.enc.yaml.
existingSecret: kanae-config      # key: config.yml
existingEnvSecret: kanae-env      # DB_*, KRATOS_SECRETS_*, KRATOS_WEBHOOK_TOKEN_*, KRATOS_SMTP_URI
