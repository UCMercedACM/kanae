{{- if .Values.secrets.create }}
{{/*
  Renders the two Secrets the rest of the chart mounts, so that

      helm secrets install kanae ./deploy/helm/kanae -n kanae \
        -f deploy/helm/secrets-prod.enc.yaml

  is the whole production install. With secrets.create false (the default) this
  file renders nothing and the chart mounts Secrets somebody else created —
  which is what `seed-k8s.sh` without -o does, and what a local k3d run uses.

  Both paths deliberately produce the SAME two names, .Values.existingEnvSecret
  and .Values.existingSecret, so every workload's secretKeyRef is identical
  either way and nothing else in the chart has to know which path was taken.
  Do not let the two drift apart.

  `required` on each value is the point of this being a template: a half-filled
  secrets file fails at render with the name of the missing key, rather than
  installing a Secret with an empty password and failing later as an
  authentication error nobody traces back to here.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingEnvSecret }}
  annotations:
    # Same generated values on every upgrade, but a rotated secrets file should
    # roll the pods that read it. The workload annotations below handle that.
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  DB_USERNAME:        {{ required "secrets.dbUsername is required"       .Values.secrets.dbUsername | quote }}
  DB_DATABASE_NAME:   {{ required "secrets.dbDatabaseName is required"   .Values.secrets.dbDatabaseName | quote }}
  DB_PASSWORD:        {{ required "secrets.dbPassword is required"       .Values.secrets.dbPassword | quote }}

  KRATOS_SECRETS_COOKIE: {{ required "secrets.kratosSecretsCookie is required" .Values.secrets.kratosSecretsCookie | quote }}
  # IRRECOVERABLE. Encrypts Kratos data at rest; the borgmatic dumps hold only
  # the ciphertext, so losing this turns a perfect restore into unreadable
  # identities.
  KRATOS_SECRETS_CIPHER: {{ required "secrets.kratosSecretsCipher is required" .Values.secrets.kratosSecretsCipher | quote }}

  KRATOS_WEBHOOK_MASTER_KEY: {{ required "secrets.kratosWebhookMasterKey is required" .Values.secrets.kratosWebhookMasterKey | quote }}
  # Derived, not chosen: blake3(context, key=master). Stored rather than
  # computed here because Sprig has no blake3 — seed-k8s.sh recomputes both on
  # every run, which is what keeps them from drifting off the master key. If you
  # hand-edit these, registration and settings webhooks start failing their
  # X-Webhook-Token check in src/routes/members.py.
  KRATOS_WEBHOOK_TOKEN_REGISTRATION: {{ required "secrets.kratosWebhookTokenRegistration is required" .Values.secrets.kratosWebhookTokenRegistration | quote }}
  KRATOS_WEBHOOK_TOKEN_SETTINGS:     {{ required "secrets.kratosWebhookTokenSettings is required"     .Values.secrets.kratosWebhookTokenSettings | quote }}

  STORAGE_KEY_ID:     {{ required "secrets.storageKeyId is required"     .Values.secrets.storageKeyId | quote }}
  STORAGE_SECRET_KEY: {{ required "secrets.storageSecretKey is required" .Values.secrets.storageSecretKey | quote }}
  KRATOS_SMTP_URI:    {{ required "secrets.kratosSmtpUri is required"    .Values.secrets.kratosSmtpUri | quote }}
---
{{/*
  config.yml. The contents come from the kanae.configYml helper, which overlays
  the deployment-specific values onto a copy of the repo's config.dist.yml
  rather than keeping a second full copy of that file here: a key added to
  config.dist.yml then appears with its documented default, and
  `mise run helm:check` catches the copy going stale.

  It is a named template because the kanae Deployment hashes the same bytes into
  a checksum/config annotation — see the comment in _helpers.tpl.

  postgres_uri is assembled from the same secrets.dbPassword the env Secret
  above uses, which is the whole reason this is rendered rather than pasted:
  kanae's pool and the Postgres container cannot disagree about the password.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.existingSecret }}
type: Opaque
stringData:
  config.yml: |
{{ include "kanae.configYml" . | indent 4 }}
{{- if .Values.backup.enabled }}
---
{{/*
  The borgmatic CronJob mounts this by name and nothing else creates it — with
  backup.enabled and no Secret here, its pods sit in CreateContainerConfigError.

  AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY are the names rclone, borgstore's
  s3: backend and boto all read, so they are the safe default for an R2 target.
  UNVERIFIED against the image actually pinned in backup.image — confirm which
  borg it ships (1.x cannot write to S3 at all; only 2.x can, via borgstore)
  before the first real backup, and rename these if its config wants something
  else. The borgmatic config itself is maintained out of band as backup.configMap.
*/}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backup.existingSecret }}
  annotations:
    "helm.sh/resource-policy": keep
type: Opaque
stringData:
  # Recovery chain: age key -> secrets-prod.enc.yaml -> this -> R2 archives ->
  # database. This link exists nowhere else.
  BORG_PASSPHRASE:       {{ required "secrets.borgPassphrase is required"  .Values.secrets.borgPassphrase | quote }}
  AWS_ACCESS_KEY_ID:     {{ required "secrets.borgS3AccessKey is required" .Values.secrets.borgS3AccessKey | quote }}
  AWS_SECRET_ACCESS_KEY: {{ required "secrets.borgS3SecretKey is required" .Values.secrets.borgS3SecretKey | quote }}
{{- end }}
{{- end }}
