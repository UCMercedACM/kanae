{{/*
  Postgres data volume, deliberately NOT a StatefulSet volumeClaimTemplate.

  Why: replicas is pinned at 1, so volumeClaimTemplates buys nothing (no
  per-ordinal volumes needed), and it couples the volume's lifecycle to a
  resource Helm manages. A standalone PVC with resource-policy: keep survives
  `helm uninstall`, a bad `helm upgrade --force`, and someone deleting the
  StatefulSet to "fix" something.

  Two protections, both needed:
    1. helm.sh/resource-policy: keep  -> Helm never deletes this PVC
    2. a StorageClass with reclaimPolicy: Retain -> deleting the PVC does NOT
       destroy the underlying Scaleway volume. The stock `scw-bssd` class ships
       reclaimPolicy: Delete, so create a Retain variant (below) and use it.

  Optional third layer: Scaleway Block Storage snapshots, scheduled outside the
  cluster. Cheap, and unlike borgmatic they capture the volume, not the dumps.
*/}}
{{- if .Values.postgres.createRetainStorageClass }}
apiVersion: storage.k8s.io/v1
kind: StorageClass
metadata:
  name: scw-bssd-retain
  annotations:
    "helm.sh/resource-policy": keep
provisioner: csi.scaleway.com
reclaimPolicy: Retain
allowVolumeExpansion: true
volumeBindingMode: WaitForFirstConsumer
parameters:
  type: bssd
---
{{- end }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: database-data
  annotations:
    "helm.sh/resource-policy": keep
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.postgres.storageClass }}
  resources:
    requests:
      storage: {{ .Values.postgres.storage }}
