{{- if .Values.ingress.enabled }}
{{/*
  Host routing only. TLS is NOT configured here.

  Certificates are issued with certbot/letsencrypt and assembled into the
  combined cert+key PEM that HAProxy wants, then referenced from the HAProxy
  config that ships alongside this chart. There is therefore no cert-manager
  annotation and no spec.tls block — adding either would have Kubernetes try to
  manage certificates that HAProxy already owns.

  Two Ingress objects rather than one because haproxy.org/path-rewrite applies
  to every path in the object it is attached to, and only the Kratos backend
  may have /auth stripped.
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanae-auth
  annotations:
    # kratos.prod.yml sets serve.public.base_url = https://api.ucmacm.dev/auth.
    # Kratos generates URLs with that prefix but serves its routes at the root
    # (/self-service/..., /sessions/whoami), so /auth must be stripped or every
    # flow 404s. `/?` matches bare /auth as well as /auth/... Single-quoted so
    # YAML does not eat the backreference.
    haproxy.org/path-rewrite: '/auth/?(.*) /\1'
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: kratos
                port: { number: 4433 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanae-api
  # no path-rewrite: kanae serves at the root
spec:
  ingressClassName: {{ .Values.ingress.className }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanae
                port: { number: 8000 }

{{/*
  Never exposed — ClusterIP only:
    kratos:4434  admin API      keto:4466/4467/4468      kanae:9555  metrics
  The SPA at ucmacm.dev is on Cloudflare Pages, not in this cluster.
*/}}
{{- end }}
