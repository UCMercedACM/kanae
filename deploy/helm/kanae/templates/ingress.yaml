{{- if .Values.ingress.enabled }}
{{/*
  TWO Ingress objects on the same host, deliberately.

  HAProxy ingress annotations are per-Ingress, not per-path. A single Ingress
  carrying `haproxy.org/path-rewrite` would apply that rewrite to EVERY path in
  it, including the kanae backend, which must not be rewritten. nginx let you
  scope this with capture groups in one object; HAProxy does not. So: one
  Ingress for /auth (rewritten), one for / (untouched).
*/}}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanae-auth
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    haproxy.org/ssl-redirect: "true"
    {{- end }}
    # kratos.prod.yml sets serve.public.base_url = https://api.ucmacm.dev/auth.
    # Kratos GENERATES urls with that prefix but SERVES its routes at the root
    # (/self-service/..., /sessions/whoami), so /auth must be stripped here or
    # every flow 404s. `/?` so bare /auth matches as well as /auth/...
    # Single-quoted: YAML must not eat the backreference backslash.
    haproxy.org/path-rewrite: '/auth/?(.*) /\1'
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: kanae-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /auth
            pathType: Prefix
            backend:
              service:
                name: kratos
                port: { number: 4433 }
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kanae-api
  annotations:
    {{- if .Values.ingress.tls.enabled }}
    cert-manager.io/cluster-issuer: {{ .Values.ingress.tls.clusterIssuer }}
    haproxy.org/ssl-redirect: "true"
    {{- end }}
    # no path-rewrite: kanae serves at the root
spec:
  ingressClassName: {{ .Values.ingress.className }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - hosts: [{{ .Values.ingress.host | quote }}]
      secretName: kanae-tls
  {{- end }}
  rules:
    - host: {{ .Values.ingress.host | quote }}
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kanae
                port: { number: 8000 }
{{- end }}

{{/*
  Controller: haproxytech/kubernetes-ingress (the vendor-maintained one).
  Install separately, it is not part of this chart:

    helm repo add haproxytech https://haproxytech.github.io/helm-charts
    helm install haproxy-ingress haproxytech/kubernetes-ingress \
      --namespace haproxy-controller --create-namespace \
      --set controller.ingressClass=haproxy \
      --set controller.service.type=NodePort      # see cost note

  Create the Kapsule cluster with ingress: none so it does not also install
  nginx or traefik.

  COST: controller.service.type=LoadBalancer makes the Scaleway CCM provision a
  paid LB. To hold the free-control-plane price, use NodePort (or hostNetwork)
  on the node's public IP with Cloudflare in front.

  Deliberately NOT exposed — ClusterIP only:
    kratos:4434  admin API      keto:4466/4467/4468      kanae:9555  metrics
*/}}
