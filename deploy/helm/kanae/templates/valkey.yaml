apiVersion: v1
kind: Service
metadata:
  name: valkey            # fixed name: config.yml limiter.storage_uri points here
spec:
  selector: { app: valkey }
  ports:
    - { name: valkey, port: 6379, targetPort: 6379 }
---
{{/*
  Deployment, not StatefulSet, and no PVC. Valkey here is a pure cache: the
  media:get-url presign cache (270s TTL, regenerable) and the limiter counters,
  which config.yml already backs with limiter.in_memory_fallback. compose runs
  it with volatile-ttl eviction and no AOF/RDB — it is designed to evict. A PVC
  would pin the pod to a node in exchange for nothing.
*/}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: valkey
spec:
  replicas: 1
  strategy:
    type: Recreate          # single cache instance; no point running two mid-roll
  selector:
    matchLabels: { app: valkey }
  template:
    metadata:
      labels: { app: valkey }
    spec:
      containers:
        - name: valkey
          image: {{ .Values.valkey.image }}
          args: ["valkey-server", "--maxmemory", {{ .Values.valkey.maxmemory | quote }}, "--maxmemory-policy", "volatile-ttl"]
          ports:
            - { name: valkey, containerPort: 6379 }
          # Verbatim from the compose healthcheck.
          readinessProbe:
            exec:
              command: ["sh", "-c", "valkey-cli PING || exit 1"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 3
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: { drop: ["ALL"] }
          volumeMounts:
            # valkey still writes a dump on shutdown with persistence off; give
            # it somewhere ephemeral rather than fighting it.
            - { name: data, mountPath: /data }
      volumes:
        - name: data
          emptyDir: {}
