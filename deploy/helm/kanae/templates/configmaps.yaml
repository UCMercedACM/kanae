{{/*
  Config carried from the compose bind mounts into ConfigMaps.

  Source of truth is still docker/ory/config/** and src/schema.sql. Helm can
  only read files inside the chart directory, so these are COPIES under
  files/. Re-sync them with `mise run helm:sync` after editing the originals —
  see the drift check in that task.

  ConfigMap keys cannot contain "/", so nested paths (kratos hooks/ and
  templates/) are flattened here and reassembled at mount time via
  items[].path in kratos.yaml.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kanae-schema
data:
  schema.sql: |
{{ .Files.Get "files/schema.sql" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: kratos-config
data:
  kratos.prod.yml: |
{{ .Files.Get "files/kratos/kratos.prod.yml" | indent 4 }}
  identity.schema.json: |
{{ .Files.Get "files/kratos/identity.schema.json" | indent 4 }}
  payload.jsonnet: |
{{ .Files.Get "files/kratos/hooks/payload.jsonnet" | indent 4 }}
  email.body.gotmpl: |
{{ .Files.Get "files/kratos/templates/recovery/valid/email.body.gotmpl" | indent 4 }}
  email.subject.gotmpl: |
{{ .Files.Get "files/kratos/templates/recovery/valid/email.subject.gotmpl" | indent 4 }}
  email.body.plaintext.gotmpl: |
{{ .Files.Get "files/kratos/templates/recovery/valid/email.body.plaintext.gotmpl" | indent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: keto-config
data:
  keto.yml: |
{{ .Files.Get "files/keto/keto.yml" | indent 4 }}
  namespaces.keto.ts: |
{{ .Files.Get "files/keto/namespaces.keto.ts" | indent 4 }}
