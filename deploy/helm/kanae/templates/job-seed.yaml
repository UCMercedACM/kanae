{{- if .Values.seed.enabled }}
{{/*
  Seeding is a Job, NOT an init container on kanae. scripts/seed/init.sh curls
  $KANAE/... and $KRATOS_PUBLIC/self-service/... so it needs kanae already
  serving. As a kanae init container that deadlocks. docker-compose.web.yml
  agrees: depends_on kanae, condition: service_healthy.

  post-install only, weight 10 so it lands after the migrations at weight 0.
  Adding post-upgrade would re-seed on every deploy. Identities created are
  @seed.test.local -- this is preview data, hence disabled by default.
*/}}
apiVersion: v1
kind: ConfigMap
metadata:
  name: kanae-seed
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "9"
    "helm.sh/hook-delete-policy": before-hook-creation
data:
  init.sh: |
{{ .Files.Get "files/seed/init.sh" | indent 4 }}
  vars.env: |
{{ .Files.Get "files/seed/vars.env" | indent 4 }}
  events.json: |
{{ .Files.Get "files/seed/data/events.json" | indent 4 }}
  members.json: |
{{ .Files.Get "files/seed/data/members.json" | indent 4 }}
  projects.json: |
{{ .Files.Get "files/seed/data/projects.json" | indent 4 }}
  tags.json: |
{{ .Files.Get "files/seed/data/tags.json" | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: kanae-seed
  annotations:
    "helm.sh/hook": post-install
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
spec:
  backoffLimit: 10
  activeDeadlineSeconds: 900
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Waits for kanae to be SERVING, not merely reachable. kanae's own image
        # because its Dockerfile apt-installs curl; postgres:18 has none.
        # Same command as the compose healthcheck.
        - name: wait-for-kanae
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          command: ["sh", "-c", "curl -fsS --max-time 2 http://kanae:8000"]
      containers:
        - name: seed
          # Needs bash, curl, jq, openssl, psql and valkey-cli. compose builds
          # this inline in docker-compose.web.yml; k8s cannot build, so publish
          # an image and point seed.image at it.
          image: {{ .Values.seed.image }}
          imagePullPolicy: {{ .Values.seed.pullPolicy }}
          command: ["bash", "/seed/init.sh"]
          env:
            - name: KRATOS_PUBLIC
              value: http://kratos:4433
            - name: KRATOS_ADMIN
              value: http://kratos:4434
            - name: KETO_WRITE
              value: http://keto:4467
            - name: KANAE
              value: http://kanae:8000
            - name: DB_HOST
              value: database
            - name: VALKEY_HOST
              value: valkey
            - name: DB_NAME
              valueFrom: { secretKeyRef: { name: {{ .Values.existingEnvSecret }}, key: DB_DATABASE_NAME } }
            - name: DB_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.existingEnvSecret }}, key: DB_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingEnvSecret }}, key: DB_PASSWORD } }
          volumeMounts:
            - { name: seed, mountPath: /seed, readOnly: true }
      volumes:
        - name: seed
          configMap:
            name: kanae-seed
            defaultMode: 0755
            items:
              - { key: init.sh,       path: init.sh }
              - { key: vars.env,      path: vars.env }
              - { key: events.json,   path: data/events.json }
              - { key: members.json,  path: data/members.json }
              - { key: projects.json, path: data/projects.json }
              - { key: tags.json,     path: data/tags.json }
{{- end }}
