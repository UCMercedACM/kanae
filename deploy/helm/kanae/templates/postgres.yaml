apiVersion: v1
kind: Service
metadata:
  name: database          # fixed name: kratos.prod.yml / keto.yml DSNs point here
spec:
  clusterIP: None
  selector:
    app: database
  ports:
    - { name: postgres, port: 5432, targetPort: 5432 }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-initdb
data:
  # Replaces the compose `dockerfile_inline` that COPY'd init.sh into the image.
  # Runs ONLY on an empty data directory.
  init.sh: |
{{ .Files.Get "files/init.sh" | indent 4 }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: database
spec:
  serviceName: database
  replicas: 1             # exactly 1. No replication configured; 2 would be two
                          # independent databases fighting over one volume.
  selector:
    matchLabels: { app: database }
  template:
    metadata:
      labels: { app: database }
    spec:
      securityContext:
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgres.image }}
          envFrom:
            - secretRef: { name: {{ .Values.existingEnvSecret }} }
          env:
            - name: POSTGRES_USER
              valueFrom: { secretKeyRef: { name: {{ .Values.existingEnvSecret }}, key: DB_USERNAME } }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: {{ .Values.existingEnvSecret }}, key: DB_PASSWORD } }
            - name: POSTGRES_DB
              valueFrom: { secretKeyRef: { name: {{ .Values.existingEnvSecret }}, key: DB_DATABASE_NAME } }
            - name: POSTGRES_INITDB_ARGS
              value: "--data-checksums"
          ports:
            - { name: postgres, containerPort: 5432 }
          volumeMounts:
            - { name: data, mountPath: {{ .Values.postgres.dataDir }} }
            - { name: initdb, mountPath: /docker-entrypoint-initdb.d }
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U $POSTGRES_USER -d $POSTGRES_DB"]
            initialDelaySeconds: 60
            periodSeconds: 30
          resources: {{- toYaml .Values.postgres.resources | nindent 12 }}
      volumes:
        - name: initdb
          configMap:
            name: postgres-initdb
            defaultMode: 0755
        # Static PVC from postgres-pvc.yaml, NOT a volumeClaimTemplate.
        # Lifecycle is decoupled from this StatefulSet and from Helm.
        - name: data
          persistentVolumeClaim:
            claimName: database-data
