{{/*
  Compose expressed ordering with:
    migrate:        depends_on database (service_healthy)
    kratos-migrate: depends_on database (service_healthy)
    keto-migrate:   depends_on database (service_healthy)
    kanae:          depends_on migrate  (service_completed_successfully)

  Helm hooks run OUTSIDE the normal release, so a pre-install hook cannot depend
  on a StatefulSet that does not exist yet. Hence: post-install/post-upgrade
  hooks + an initContainer that polls Postgres. The three migrations are
  mutually independent, so they share hook-weight 0 and run concurrently.
*/}}
{{- define "kanae.migrateJob" -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .name }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "0"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 10
  template:
    spec:
      restartPolicy: OnFailure
      initContainers:
        # Single-shot, same reasoning as the Deployment gates: restartPolicy is
        # OnFailure, so kubelet restarts this container in place with
        # exponential backoff, and backoffLimit below bounds the total. An
        # `until` loop here was strictly worse — unbounded, so a Postgres that
        # never arrives hung the Job forever without ever tripping
        # backoffLimit, blocking the whole helm upgrade on the hook.
        - name: wait-for-postgres
          image: {{ .root.Values.postgres.image }}
          envFrom:
            - secretRef: { name: {{ .root.Values.existingEnvSecret }} }
          command: ["pg_isready", "-h", "database", "-U", "$(DB_USERNAME)"]
          resources:
            requests: { cpu: 10m, memory: 32Mi }
            limits:   { memory: 64Mi }
      containers: {{- toYaml .containers | nindent 8 }}
      volumes: {{- toYaml .volumes | nindent 8 }}
{{- end -}}
---
# Atlas: applies src/schema.sql to the kanae database.
{{ include "kanae.migrateJob" (dict "root" . "name" "kanae-migrate"
   "containers" (list (dict
     "name" "atlas"
     "image" .Values.migrate.atlasImage
     "args" (list "schema" "apply"
                  (ternary "--auto-approve" "--dry-run" .Values.migrate.autoApprove)
                  "--to" "file:///schema/schema.sql"
                  "--url"     "postgres://$(DB_USERNAME):$(DB_PASSWORD)@database:5432/$(DB_DATABASE_NAME)?search_path=public&sslmode=disable"
                  "--dev-url" "postgres://$(DB_USERNAME):$(DB_PASSWORD)@database:5432/postgres?search_path=public&sslmode=disable")
     "envFrom" (list (dict "secretRef" (dict "name" .Values.existingEnvSecret)))
     "volumeMounts" (list (dict "name" "schema" "mountPath" "/schema"))))
   "volumes" (list (dict "name" "schema" "configMap" (dict "name" "kanae-schema")))) }}
---
{{ include "kanae.migrateJob" (dict "root" . "name" "kratos-migrate"
   "containers" (list (dict
     "name" "kratos-migrate"
     "image" .Values.ory.kratosImage
     "args" (list "migrate" "sql" "-c" "/etc/config/kratos.prod.yml" "--read-from-env" "--yes")
     "envFrom" (list (dict "secretRef" (dict "name" .Values.existingEnvSecret)))
     "volumeMounts" (list (dict "name" "config" "mountPath" "/etc/config" "readOnly" true))))
   "volumes" (list (dict "name" "config" "configMap" (dict "name" "kratos-config")))) }}
---
{{ include "kanae.migrateJob" (dict "root" . "name" "keto-migrate"
   "containers" (list (dict
     "name" "keto-migrate"
     "image" .Values.ory.ketoImage
     "args" (list "migrate" "up" "-c" "/etc/config/keto.yml" "--yes")
     "envFrom" (list (dict "secretRef" (dict "name" .Values.existingEnvSecret)))
     "volumeMounts" (list (dict "name" "config" "mountPath" "/etc/config" "readOnly" true))))
   "volumes" (list (dict "name" "config" "configMap" (dict "name" "keto-config")))) }}
