# Local overrides: helm install kanae ./kanae -f values-local.yaml
#
# Everything here exists because the chart's defaults assume Kapsule.
# Keep this file in git — it has no secrets in it.

global:
  storageClass: local-path        # k3d ships rancher local-path-provisioner

postgres:
  storageClass: local-path
  createRetainStorageClass: false # csi.scaleway.com does not exist locally
  storage: 2Gi
  resources:
    requests: { cpu: 50m, memory: 128Mi }
    limits:   { memory: 512Mi }

image:
  # built locally + `k3d image import`, so never try to pull it
  repository: ghcr.io/ucmercedacm/kanae
  tag: dev
  pullPolicy: Never

kanae:
  replicas: 1
  granianWorkers: 1               # laptop

valkey:
  maxmemory: 64mb

migrate:
  autoApprove: true               # local db is disposable

backup:
  enabled: false                  # no borg repo locally
  preUpgrade: false               # ...so don't gate upgrades on it either

ingress:
  enabled: false
  # Skip the ingress entirely locally and port-forward instead:
  #   kubectl port-forward svc/kanae 8000:8000
  #   kubectl port-forward svc/kratos 4433:4433
  #
  # If you DO want to exercise the HAProxy /auth path-rewrite (worth doing at
  # least once — it is the most breakable part of the chart):
  #   1. k3d cluster create kanae --port "8080:80@loadbalancer"
  #   2. helm install haproxytech/kubernetes-ingress --set controller.service.type=NodePort
  #   3. set ingress.enabled=true, ingress.host=api.kanae.localhost
  #   4. ingress.tls.enabled=false  (no cert-manager locally)
  # then browse http://api.kanae.localhost:8080/auth/self-service/login/browser

existingSecret: kanae-config
existingEnvSecret: kanae-env
