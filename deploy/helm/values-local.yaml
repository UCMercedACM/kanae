# Local k3d overrides.
#   helm install kanae ./deploy/helm/kanae -n kanae --create-namespace \
#     -f deploy/helm/values-local.yaml
#
# Everything here exists because the chart's defaults assume Kapsule.
# No secrets in this file — keep it in git.

image:
  # Local-only tag, built and imported by `mise run k3d:images`. It is NOT
  # ghcr.io/ucmercedacm/kanae:edge, which reads like the obvious choice and is a
  # private package: a k3d node has no registry credentials, so pulling it fails
  # with "failed to fetch anonymous token: 401 Unauthorized" and both the kanae
  # Deployment and the seed Job's wait-for-kanae init container sit in
  # ImagePullBackOff. A `docker pull` on the host can still succeed, because the
  # host daemon has ghcr credentials the cluster does not — do not let that
  # mislead you.
  repository: kanae
  tag: dev
  # Never, not Always: the image only exists because k3d image import put it
  # there. Always would send the kubelet to a registry that has no such tag.
  pullPolicy: Never

kanae:
  replicas: 1
  granianWorkers: 1               # laptop
  # Off, because the local stack exists to run the seed script against it and
  # the two cannot coexist. Seeding provisions the 15 members in
  # scripts/seed/data/members.json serially and calls GET /members/me once per
  # member; that route carries @router.limiter.limit("10/minute"), so member 11
  # onward gets a 429, the script reads no .id out of it and fails with "did not
  # resolve an identity" — a message that points nowhere near rate limiting.
  # Deterministic, not flaky: it fails at the same place every run.
  limiterEnabled: false

postgres:
  # k3d ships rancher local-path-provisioner. csi.scaleway.com does not exist
  # here, so the scw-bssd-retain default would leave the PVC Pending forever.
  storageClass: local-path
  storage: 2Gi

valkey:
  maxmemory: 64mb

ory:
  # Nothing here is served over TLS, and Kratos issues Secure cookies unless
  # told otherwise. curl drops a Secure cookie on an http:// request to a
  # non-localhost host, so the seed Job's browser self-service flows would fail
  # CSRF against http://kratos:4433 with this off.
  insecureCookies: true

backup:
  # No borg repository locally. Leaving this on also breaks iteration: the
  # pre-upgrade hook has backoffLimit 1, so a failing backup fails the upgrade.
  enabled: false

ingress:
  # Needs the HAProxy controller. Port-forward instead:
  #   kubectl -n kanae port-forward svc/kanae 8000:8000
  #   kubectl -n kanae port-forward svc/kratos 4433:4433
  #
  # To exercise the /auth path-rewrite for real — worth doing once, it is the
  # most breakable part of the chart:
  #   k3d cluster create kanae --port "8080:80@loadbalancer"
  #   helm install haproxy-ingress haproxytech/kubernetes-ingress \
  #     -n haproxy-controller --create-namespace \
  #     --set controller.ingressClass=haproxy
  #   then set enabled: true and host: api.kanae.localhost
  #   and browse http://api.kanae.localhost:8080/auth/self-service/login/browser
  enabled: false

seed:
  # On for local runs — seeding Kratos identities, Keto tuples and Kanae data is
  # most of the point of standing the stack up, and it exercises the webhook
  # path between Kratos and kanae that nothing else does.
  #
  # Built and imported by `mise run k3d:images`, same as the app image above.
  # Nothing publishes a kanae-seed image anywhere, so this tag is local or it is
  # nothing.
  enabled: true
  image: kanae-seed:dev
  pullPolicy: Never
