# Plaintext EXAMPLE of what secrets-prod.enc.yaml holds before encryption.
# The real file is encrypted; this one is committed as documentation only.
#
# Split rationale: this file is 100% secrets, values-prod.yaml is 0% secrets.
# That means SOPS can encrypt every value with no regex, and the split itself
# is the safety mechanism.

secrets:
  # ---- generated by seed-k8s.sh, never typed by hand ----------------------
  dbPassword: "REPLACE"                    # openssl rand -hex 32
  kratosSecretsCookie: "REPLACE"           # openssl rand -hex 32
  kratosSecretsCipher: "REPLACE"           # openssl rand -hex 16
  #   ^ IRRECOVERABLE. Encrypts Kratos data at rest. Your borgmatic dumps hold
  #     the ciphertext; without this key they restore to unreadable identities.

  kratosWebhookMasterKey: "REPLACE"        # openssl rand -hex 32 (64 hex chars)

  # Derived from kratosWebhookMasterKey via blake3 keyed-hash. Stored only
  # because Sprig has no blake3, so Helm cannot compute them at render time.
  # seed-k8s.sh RECOMPUTES both on every run, so they cannot drift from the
  # master key. Never hand-edit these.
  kratosWebhookTokenRegistration: "REPLACE"   # blake3(b"kratos.registration.v1", key=master)
  kratosWebhookTokenSettings: "REPLACE"       # blake3(b"kratos.settings.v1",     key=master)

  # ---- externally issued: a human pastes these in via `sops` --------------
  storageKeyId: "REPLACE"                  # Cloudflare R2 access key id
  storageSecretKey: "REPLACE"              # Cloudflare R2 secret
  kratosSmtpUri: "REPLACE"                 # smtps://user:pass@smtp.example:465

  # ---- backup ------------------------------------------------------------
  borgPassphrase: "REPLACE"                # openssl rand -hex 32
  #   ^ Recovery chain: age key -> this file -> borgPassphrase -> R2 archives
  #     -> database. Every link must survive; this one lives only here.
  borgS3AccessKey: "REPLACE"
  borgS3SecretKey: "REPLACE"
