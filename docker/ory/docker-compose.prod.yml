name: ory_prod

x-hardening: &hard
  read_only: true
  tmpfs: ["/tmp:rw,noexec,nosuid,size=32m"]
  security_opt: ["no-new-privileges:true"]
  cap_drop: [ALL]

services:
  kratos-migrate:
    <<: *hard
    container_name: kanae_kratos_migrate
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DSN: postgres://${DB_USERNAME}:${DB_PASSWORD}@database:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4

      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER}
    command: migrate sql -c /etc/config/kratos.prod.yml --read-from-env --yes
    networks:
      - default
      - db_bridge
    volumes:
      - ./config/kratos:/etc/config:ro
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure

  kratos:
    <<: *hard
    container_name: kanae_kratos
    image: oryd/kratos:v26.2.0@sha256:2a13bb8d362c7a7ae33bd7c0f5168aee46921f15c916a06346db91c06dc76643
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DSN: postgres://${DB_USERNAME}:${DB_PASSWORD}@database:5432/kratos?sslmode=disable&max_conns=20&max_idle_conns=4

      SECRETS_COOKIE: ${KRATOS_SECRETS_COOKIE}
      SECRETS_CIPHER: ${KRATOS_SECRETS_CIPHER}

      SELFSERVICE_FLOWS_REGISTRATION_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE: ${KRATOS_WEBHOOK_TOKEN_REGISTRATION}
      SELFSERVICE_FLOWS_SETTINGS_AFTER_PASSWORD_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE: ${KRATOS_WEBHOOK_TOKEN_SETTINGS}
      SELFSERVICE_FLOWS_SETTINGS_AFTER_PROFILE_HOOKS_0_CONFIG_AUTH_CONFIG_VALUE: ${KRATOS_WEBHOOK_TOKEN_SETTINGS}

      COURIER_SMTP_CONNECTION_URI: ${KRATOS_SMTP_URI}
    command: serve -c /etc/config/kratos.prod.yml --watch-courier
    ports:
      - "127.0.0.1:4433:4433"
    networks:
      - default
      - db_bridge
    volumes:
      - ./config/kratos:/etc/config:ro
    depends_on:
      kratos-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: wget -q --spider http://127.0.0.1:4433/health/ready || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 30s
    restart: unless-stopped

  keto-migrate:
    <<: *hard
    container_name: kanae_keto_migrate
    image: oryd/keto:v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DSN: postgres://${DB_USERNAME}:${DB_PASSWORD}@database:5432/keto?sslmode=disable&max_conns=20&max_idle_conns=4
    command: migrate up -c /etc/config/keto.yml --yes
    networks:
      - default
      - db_bridge
    volumes:
      - ./config/keto:/etc/config:ro
    depends_on:
      database:
        condition: service_healthy
    restart: on-failure

  keto:
    <<: *hard
    container_name: kanae_keto
    image: oryd/keto:v26.2.0@sha256:bfdb8b9e283aedbd9e1d005c44eb1bbefd2096b2cb5b5aa0b7360b6e39c178d2
    environment:
      DB_USERNAME: ${DB_USERNAME}
      DB_PASSWORD: ${DB_PASSWORD}
      DSN: postgres://${DB_USERNAME}:${DB_PASSWORD}@database:5432/keto?sslmode=disable&max_conns=20&max_idle_conns=4
    command: serve -c /etc/config/keto.yml
    networks:
      - default
      - db_bridge
    volumes:
      - ./config/keto:/etc/config:ro
    depends_on:
      keto-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: wget -q --spider http://127.0.0.1:4466/health/ready || exit 1
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 20s
    restart: unless-stopped
