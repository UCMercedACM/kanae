name: kanae_test

include:
  - path: ory/docker-compose.yml
    project_directory: ory

services:
  kanae:
    container_name: kanae
    build:
      context: ..
      dockerfile: docker/Dockerfile
    environment:
      GRANIAN_WORKERS: ${KANAE_WORKERS:-1}
    volumes:
      # Do not edit the next line. If you want to change the path of the configuration file, please edit the CONFIG_LOCATION variable
      - ${CONFIG_LOCATION}:/kanae/config.yml
    ports:
      - 8000:8000
    networks:
      - default
      - db_bridge
    depends_on:
      database:
        condition: service_healthy
        restart: true
      valkey:
        condition: service_healthy
        restart: true
      kratos:
        condition: service_started
        restart: true
      keto:
        condition: service_started
        restart: true
      garage:
        condition: service_started
        restart: true
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: curl -fsS --max-time 2 http://127.0.0.1:8000
      interval: 3s
      timeout: 5s
      retries: 20
      start_period: 30s

  database:
    container_name: kanae_postgres
    build:
      context: .
      dockerfile_inline: |
        FROM postgres:18
        COPY postgres/init.sh /docker-entrypoint-initdb.d/init.sh
    environment:
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_DATABASE_NAME}
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_INITDB_ARGS: "--data-checksums"

      KANAE_PASSWORD: ${KANAE_PASSWORD}
      KRATOS_PASSWORD: ${KRATOS_PASSWORD}
      KETO_PASSWORD: ${KETO_PASSWORD}
      POSTGRES_MONITOR_PASSWORD: ${POSTGRES_MONITOR_PASSWORD}

      KANAE_MIGRATE_PASSWORD: ${KANAE_MIGRATE_PASSWORD}
      KRATOS_MIGRATE_PASSWORD: ${KRATOS_MIGRATE_PASSWORD}
      KETO_MIGRATE_PASSWORD: ${KETO_MIGRATE_PASSWORD}
    command: >
      postgres
      -c hba_file=/etc/postgresql/pg_hba.conf
      -c max_connections=150
    ports:
      - 127.0.0.1:5432:5432
    networks:
      - default
      - db_bridge
    volumes:
      - database:/var/lib/postgresql/18/docker
      - ./postgres/pg_hba.conf:/etc/postgresql/pg_hba.conf:ro
    healthcheck:
      test: pg_isready --dbname='${DB_DATABASE_NAME}' --username='${DB_USERNAME}' || exit 1; Chksum="$$(psql --dbname='postgres' --username='postgres_monitor' --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m

  valkey:
    container_name: kanae_valkey
    image: valkey/valkey:9-alpine@sha256:48332870af354a799964c0012ae1194a0bf2bf894eb508f945810596dc2d8d11
    command: >
      valkey-server --maxmemory 256mb --maxmemory-policy volatile-ttl
    ports:
      - 127.0.0.1:6379:6379
    networks:
      - default
    healthcheck:
      test: valkey-cli PING || exit 1
      interval: 10s
      timeout: 3s
      start_period: 10s
      start_interval: 3s

  garage:
    container_name: kanae_garage
    image: dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
    ports:
      - "3900:3900" # S3 API
      - "3902:3902" # S3 web
    environment:
      GARAGE_RPC_SECRET: ${GARAGE_RPC_SECRET}
      GARAGE_ADMIN_TOKEN: ${GARAGE_ADMIN_TOKEN}
      GARAGE_METRICS_TOKEN: ${GARAGE_METRICS_TOKEN}
    volumes:
      - garage:/var/lib/garage/data
      - garage:/var/lib/garage/meta
      - ../garage.toml:/etc/garage.toml
    restart: unless-stopped

  migrate:
    container_name: kanae_migrate
    image: arigaio/atlas:latest@sha256:89284e6705be3a390634221c9bb976d05a457b5503527a5a52d92f77b8788df5
    command: >
      schema apply
      --auto-approve
      --to "file://schema.sql"
      --url "postgres://kanae_migrate:${KANAE_MIGRATE_PASSWORD}@database:5432/${DB_DATABASE_NAME}?search_path=public&sslmode=disable"
      --dev-url "postgres://kanae_migrate:${KANAE_MIGRATE_PASSWORD}@database:5432/postgres?search_path=public&sslmode=disable"
    networks:
      - db_bridge
      - default
    depends_on:
      database:
        condition: service_healthy
    volumes:
      - ../src/schema.sql:/schema.sql

volumes:
  database:
  garage:

networks:
  db_bridge:
    driver: bridge
