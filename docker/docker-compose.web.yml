name: ucmacm

include:
  - path: docker-compose.yml
    project_directory: .

services:
  chapter-website:
    container_name: chapter_website
    image: ghcr.io/ucmercedacm/chapter-website:edge@sha256:93c149c132bc99483de23b549805465d77a61ccc04567ceaa207480a8bd88611
    ports:
      - 5173:8080
    depends_on:
      kanae:
        condition: service_healthy
        required: true
    healthcheck:
      test: wget -q -O /dev/null http://localhost:8080/ || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    restart: always

  kanae-seed:
    container_name: kanae_seed
    build:
      dockerfile_inline: |
        FROM alpine:latest
        RUN apk add --no-cache bash curl jq openssl postgresql18-client valkey-cli
    entrypoint: bash /seed/init.sh
    environment:
      KRATOS_PUBLIC: http://kratos:4433
      KRATOS_ADMIN: http://kratos:4434
      KETO_WRITE: http://keto:4467
      KANAE: http://kanae:8000
      DB_HOST: database
      VALKEY_HOST: valkey
      DB_USER: kanae
      DB_NAME: ${DB_DATABASE_NAME}
      POSTGRES_PASSWORD: ${KANAE_PASSWORD}
    volumes:
      - ../scripts/seed:/seed:ro
    networks:
      - default
      - db_bridge
    depends_on:
      kanae:
        condition: service_healthy
    restart: "no"
